name: CI — 합성 검증 스위트

# 왜 있나 [W9 점검]
#   테스트 12본이 **사람 기억으로** 돌아가고 있었다. "패턴은 기억이 아니라 구조로 막는다"를
#   세 번 재확인했으면서 정작 그 검증 장치 자체가 수동이었다 — 한 번만 잊으면 회귀가 조용히
#   들어온다(실제로 오늘 "고쳤다는 게 안 고쳐진" 사고가 났다).
#   여기서 지키는 것: 상태 규약(kill-9 재개·멱등) · 관측 계약(read-only AST) · 무발송 구조 ·
#   승인 규율(no-approval-no-execute) · 알림 계약 · 장애 내성(카오스 7종).
#
# 시크릿 0 — 이 스위트는 외부에 접근하지 않는다(그게 설계상 보장이고, 여기서 재확인된다):
#   KV_NO_SEND=1 로 슬랙 발송 차단 · claude/노션/Gmail 은 전부 스텁 · KV_DATA 는 러너 임시 경로.
#   실 claude 를 부르는 _synthetic_slice.py 만 제외하고, 그 파일의 핵심(무발송 AST)은 아래에서
#   별도 스텝으로 검사한다.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read          # 읽기만 — 이 워크플로는 아무것도 쓰지 않는다

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KV_NO_SEND: "1"       # 실발송 킬 스위치(테스트 스텁 누락 시의 최후 방어)
      TZ: Asia/Seoul        # 로컬(맥)과 같은 날짜 기준 — 러너 UTC 로 갈리면 오탐(W2 TZ 사고)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install -U pip
          pip install -e ./kv-core
          pip install PyYAML google-api-python-client google-auth

      - name: 합성 스위트 (테스트별 격리 KV_DATA)
        run: |
          set -e
          fail=0
          # [W9 Phase0] 하드코딩 목록 → **자동 발견 + 명시 제외**.
          # 새 테스트를 CI 에 넣는 걸 사람이 기억해야 했다(그래서 _p0_probes 가 누락됐다).
          # 오늘의 실패는 전부 "사람이 기억해야 하는 것"에서 나왔다 — 기계가 세게 한다.
          # 제외는 이유가 있는 것만: _synthetic_slice 는 실제 claude 를 부른다(CI 에 자격 없음,
          # 대신 그 핵심인 AST 무발송 검사를 아래 단계가 따로 돌린다).
          EXCLUDE="_synthetic_slice"
          for f in kv-core/tests/_*.py; do
            t=$(basename "$f" .py)
            case " $EXCLUDE " in *" $t "*) echo "── $t (제외: 실 claude 호출)"; continue;; esac
            echo "── $t"
            if ! KV_DATA="$RUNNER_TEMP/kvdata-$t" python "kv-core/tests/$t.py"; then
              echo "::error::$t 실패"; fail=1
            fi
          done
          exit $fail

      - name: 스킬 잡 합성 (노션·claude 불호출)
        run: |
          set -e
          KV_DATA="$RUNNER_TEMP/kvdata-mm" python skills/net-sourcing/project/jobs/meeting_mail_job.py --synthetic
          KV_DATA="$RUNNER_TEMP/kvdata-jj" python skills/net-sourcing/project/jobs/judge_job.py --synthetic

      - name: 무발송 구조 검사 (AST) — _synthetic_slice 의 핵심만 분리
        # 실 claude 를 부르는 슬라이스 전체는 CI 에서 못 돌리지만, **발송 경로 부재**는
        # 매 커밋 확인돼야 한다(W10 이후엔 이게 유일한 물리적 안전장치다).
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          bad = []
          for f in ("gmail.py", "approvals_tick.py", "slackbot.py", "approval.py"):
              p = Path("kv-core/kv_core") / f
              for n in ast.walk(ast.parse(p.read_text(encoding="utf-8"))):
                  if (isinstance(n, ast.Call) and isinstance(n.func, ast.Attribute)
                          and n.func.attr == "send"):
                      bad.append(f"{f}:L{n.lineno}")
          print("검사 대상 4모듈 · .send() 호출:", bad or "0건 ✅")
          sys.exit(1 if bad else 0)
          PY

      - name: 선언 정합 (registry·contracts·불변식)
        run: |
          python - <<'PY'
          import yaml
          from kv_core import registry, validate
          ts = registry.load()
          cs = validate.load_contracts("config/contracts.yaml")
          n = yaml.safe_load(open("skills/net-sourcing/project/config.yaml"))
          r = yaml.safe_load(open("config/resources.yaml"))
          mm = n["meeting_mail"]
          # [적대리뷰 H3] 예전 식은 judge 를 ×1 로 셌다 — judge_job 도 attempt-suffix 를
          # 갖는데 meeting_mail 에만 ×attempts 보정을 했다. judge 는 이제 gate 일별 장부로
          # 스스로 천장(block − reserve)에서 멈추므로, 검증할 불변식은 **예약이 실제
          # meeting_mail 최악치를 덮는가**와 **하루 총합이 차단선을 안 넘는가** 둘이다.
          mm_worst = int(mm["max_drafts_per_run"]) * int(mm["max_attempts_per_day"])
          reserve = int(n["judge"]["reserve_calls_for_others"])
          block = int(r["claude"]["daily_calls_block"])
          judge_ceiling = block - reserve
          print(f"registry {len(ts)} tasks · contracts {len(cs)} · "
                f"judge 천장 {judge_ceiling} + meeting_mail 최악 {mm_worst} <= block {block}")
          assert reserve >= mm_worst, f"예약 부족: {reserve} < meeting_mail 최악 {mm_worst}"
          assert judge_ceiling + mm_worst <= block, f"불변식 위반: {judge_ceiling}+{mm_worst} > {block}"
          assert judge_ceiling > 0, "judge 천장이 0 이하 — 예약이 차단선을 먹었다"
          PY
