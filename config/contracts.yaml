# 산출물 검증 계약 (Write-Audit-Publish 의 Audit 규칙). 정본 = 이 파일 하나. [W5·ADR 0003]
# kv_core.validate.load_contracts() 가 읽는다. 코드에 하드코딩하지 않는다(결정 ③).
#
# 스테이지마다:
#   on_invalid: halt | quarantine   ← 부작용 가역성으로 고른다(결정 ②)
#     halt       = 하나라도 어긋나면 전체 중단(발송 등 비가역 스테이지)
#     quarantine = 어긋난 것만 DLQ 격리하고 나머지 진행(판정 기입 등 가역 스테이지)
#   schema: {필드: {type, required, enum, nonempty}}
#   min_records: 통과 레코드 최소 기대치 — 0건 성공(진공 통과)을 침묵 실패와 구분한다(규칙05).
#     판정 스테이지는 후보가 있을 때만 도니 최소 1. meeting-mail 은 "보낼 대상 없음"이 정당해서 0(기본).

# ── (테스트 전용) 합성 수직선 계약 — tests/_synthetic_slice.py 가 쓴다. 실 파이프라인 계약 아님. ──
judge:
  on_invalid: quarantine          # 오판 한 건은 다음 회차가 주움. recall 우선.
  min_records: 1                  # 후보를 넣고 판정 0건이면 이상 신호(인증 만료·프로즈 출력 등)
  schema:
    id:      {type: int, required: true}
    verdict: {type: str, required: true, enum: [keep, promo, unsure]}
    reason:  {type: str, required: false, nonempty: true}

# ── 스레드·링크드인 Tier 판정 (노션 select 기입 = 가역) ──
# [W6] 실형으로 교체: 실키는 노션 page UUID(str) — 구 id:int 는 합성 전용 형이었다.
#      Cut 추가(judge-criteria.md A12 확정). 최종 권위는 judge_cli.apply 의 행별 allowed(라이브 스키마) — 이중 방어.
judge-tier:
  on_invalid: quarantine
  min_records: 1
  schema:
    page_id:   {type: str, required: true, nonempty: true}
    verdict:   {type: str, required: true, enum: [Catch, Trend, Wait, Cut]}
    reason:    {type: str, required: false, nonempty: true}
    one_liner: {type: str, required: false, nonempty: true}

# ── 비플랜 1차 스크리닝 (노션 '점수' select 기입 = 가역) ── [W11 신규]
# 정답지가 있는 유일한 판정이다 — 판정 완료 499건이 노션에 있어 **노션에 쓰기 전에**
# 백테스트로 정확도를 잴 수 있다(tools/bplan_backtest.py). 그물망 judge 엔 없던 자산.
#
# `score` enum 은 라이브 스키마(`점수` select)에서 온 값이다. 최종 권위는 행별 `allowed`.
#   `?` = 미채점 — 도메인 라우팅한 건에 쓴다. **빈칸으로 두면 안 된다**: 빈칸은
#   "아직 판정 안 함"과 구별되지 않아 다음 회차 큐에 영원히 다시 들어온다
#   (그물망에서 컷 값이 없어 `is_empty` 에 매주 재순환하던 것과 같은 함정).
bplan-score:
  on_invalid: quarantine          # 판정 기입은 select 덮어쓰기 = 가역
  min_records: 1                  # 대상을 넣고 0건이면 계통 장애(인증 만료·형식 붕괴)
  schema:
    page_id: {type: str, required: true, nonempty: true}
    score:   {type: str, required: true, enum: ["칼드랍", "Red", "Orange", "Green", "?"]}
    # [2026-08-16] enum 에서 `""` 를 뺐다. 이건 "빈 값도 허용값"이라는 선언이 아니라,
    # 필수 아닌 필드의 `""` 가 enum 위반으로 잡히던 것을 우회하려 끼워 넣은 값이었다.
    # 이제 `validate.check_record` 가 **필수 아닌 필드의 빈 문자열을 "없음"으로 본다**.
    # enum 에는 실제 도메인만 적는다.
    fwd:     {type: str, required: false, enum: ["ReviewerTwo", "ReviewerOne", "zero"]}
    reason:  {type: str, required: false, nonempty: true}

# ── 앱스토어 판정 (노션 '판정' select = 가역) ── [W6 신규]
judge-appstore:
  on_invalid: quarantine
  min_records: 1
  schema:
    page_id: {type: str, required: true, nonempty: true}
    verdict: {type: str, required: true, enum: [Pass, Drop]}
    reason:  {type: str, required: false, nonempty: true}

# ── 그물망 미팅요청 메일 초안 (승인 큐 적재 = 가역) ──
# 🔴 [W9 C-H3 정정] halt → quarantine. 두 가지가 틀렸었다:
#   ① 이 스테이지의 부작용은 **승인 큐 파일**(가역)이지 발송이 아니다 — 가역성 기준상 quarantine.
#      비가역 관문은 승인 후 executor 이고, 거기엔 사람의 ✅ 가 이미 서 있다.
#   ② `to` 는 **코드가 RECIPIENT 로 덮어쓰는 값**인데 required 라, LLM 이 그 필드를 빠뜨리면
#      어차피 버릴 값 하나 때문에 다른 정상 후보의 초안까지 전량 죽었다(halt = 발행 0).
meeting-mail:
  on_invalid: quarantine          # 어긋난 초안만 DLQ 격리, 나머지 후보는 진행
  min_records: 0                  # "보낼 대상 없음"은 정당(진공 방지는 잡 레벨에서 — C-M4)
  schema:
    to:      {type: str, required: false, nonempty: true}   # 코드가 공급(수신자는 LLM 소관 아님)
    subject: {type: str, required: true, nonempty: true}
    body:    {type: str, required: true, nonempty: true}
