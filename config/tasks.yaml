# Task Registry — 노션 `인턴 업무 자동화` DB 의 코드 미러 (정본).
# 설계 근거·전체 지도: docs/task-registry-mirror.md
# "무슨 업무가 존재하나"(노션) 와 "그게 자동화됐나"(status) 를 분리 추적한다.
# 필드:
#   kind:      routine(cadence 있음·스케줄 대상) | ondemand(사람 트리거)
#   catch_up:  coalesce(1회로 합침) | backfill(놓친 만큼 다 채움)          [결정 A]
#   watermark: last_success(실패면 재시도) | last_attempt(시도했으면 전진)  [결정 B]
#   resources: 배타 락 대상 자원(겹치는 잡끼리만 배타)                       [결정 3]
#              claude = claude -p 구독(공유 쿼터) → 세션 직렬화 [ADR 0003·W2 레슨 #3]
#   origin:    system(우리가 시작→팀 슬랙방) | partner(심사역 트리거→개인)  [결정 10, 승인 라우팅 기본값]
#   covers:    이 task 가 커버하는 노션 업무 카테고리(reconcile 대조용)
#   status:    done | partial | slot

# ── 스케줄 task (cadence) ──
- name: sourcing
  skill: net-sourcing
  kind: routine
  cadence: weekly
  catch_up: coalesce         # Apify 회당 ~$10.5 — backfill 은 새 데이터 0 인데 돈만 태움
  watermark: last_success    # 수집 실패 = 후보 0 → 다시 시도
  resources: [apify, notion]                  # [W8] claude·gmail 은 분리된 judge·meeting-mail task 소관
  stages: [collect, land]                     # [W8] meeting-mail 도 별도 task 로 분리(승인 브릿지와 함께)
  origin: system
  covers: [그물망]
  status: partial
  notes: judge 는 별도 judge task 로 분리(W6, 무인) · meeting-mail(auto-mail) 노션에만·리포 미이식(W8 승인브릿지와 함께)

- name: judge                # [W6] 무인 판정 — 미판정(Tier/판정 is_empty) 행 → claude → 검증 → 기입(가역)
  skill: net-sourcing
  kind: routine
  cadence: daily             # 07:00 appstore-sourcing 크론이 매일 미판정 행을 만든다
  catch_up: coalesce
  watermark: last_success
  resources: [claude, notion]
  stages: [criteria-gate, export, judge-apply]
  origin: system
  runner: local
  covers: [그물망]
  status: partial
  notes: references/judge-criteria.md 룰 본문이 비어 있으면 criteria-gate 가 fail-loud 스킵 — 룰 기입 즉시 코드 변경 0으로 가동

- name: meeting-mail         # [W8] Catch 창업자 → claude 초안 → 승인 큐 (Gmail 초안은 승인 후 tick)
  skill: net-sourcing
  kind: routine
  cadence: daily
  catch_up: coalesce
  watermark: last_success
  resources: [claude, notion]   # gmail 없음 — draft-after-approve 라 gmail 부작용은 approvals tick 소관
  stages: [collect-catch, draft, request-approval]
  origin: system
  runner: local
  covers: [그물망]
  status: partial
  notes: 수신자 W8 고정 hello@ · halt 계약 · dedup_key=page_id (선필터=claude 절약 커서)

- name: sourcing-followup
  skill: net-sourcing
  kind: routine
  cadence: quarterly         # DB 인물 3~4개월 재확인
  catch_up: coalesce
  watermark: last_success
  resources: [claude, notion]   # 재판정 = claude -p [ADR 0003]
  stages: [followup]
  origin: system
  covers: [그물망]
  status: partial

- name: appstore-snapshot
  skill: net-sourcing
  kind: routine
  cadence: daily
  catch_up: coalesce         # [W6] backfill→coalesce: 애플은 과거 순위를 안 준다 — backfill 은 오늘을
                             # N번 재수집하며 워터마크에 거짓 "과거 성공"을 남길 뿐. 결손은 staleness 로 관측(W7).
  watermark: last_success
  resources: []              # $0·무인증
  stages: [snapshot]
  origin: system
  runner: local              # ✅ [컷오버 2026-08-07] 3일 검증 통과(8/5·8/6·8/7 로컬 84 = GH 84 완전 일치)
                             # → 로컬 스케줄러가 primary. shadow 플래그 제거 = 스위치 전부였다.
  covers: [그물망]
  status: done
  notes: |
    ✅ [2026-08-11] GH Actions **은퇴 완료** — schedule 제거, 수동 dispatch 만 남김.
    1주 백업 병행(2026-08-07~08-11, 역방향 섀도: 구가 신을 백업) 동안 로컬이 매일 84/84 성공.
    저장소 분리(GH=data 브랜치 · 로컬=~/kv-data)라 병행 중에도 규칙 01 위반 아니었다.
    되돌리려면 그 파일의 schedule 주석을 풀면 된다 — 코드 변경 0.
    이제 이 task 의 유일한 실행 주체는 로컬 launchd com.kv.scheduler 다.

- name: appstore-sourcing    # [W6] 카탈로그 등재 — 실행 주체는 기존 plist(스케줄러 불관여)
  skill: net-sourcing
  kind: routine
  cadence: daily
  catch_up: coalesce
  watermark: last_attempt
  resources: [notion]
  stages: [collect, land]
  origin: system
  runner: launchd-direct     # 실행체 = ~/Library/LaunchAgents/com.kv.net-sourcing.appstore.plist (07:00 KST)
  covers: [그물망]
  status: done
  notes: main.py run --channel appstore ($0·수집→노션 착지 138행/일). 스케줄러 이관은 appstore-snapshot 컷오버 검증 후 검토.

- name: mail-triage
  skill: mail-harness
  kind: routine
  cadence: daily
  catch_up: coalesce
  watermark: last_attempt    # 미처리 메일은 인박스에 남아 다음 sweep 이 집음
  resources: [claude, gmail-inbox]   # classify·draft = claude -p [ADR 0003]
  stages: [sweep, classify, draft]
  origin: system
  covers: [메일관리]
  status: partial
  notes: 컷오버 전(W5) · 광고아카이빙·Webflow·제안·인바운드 4업무 라우팅 규칙 존재

- name: bplan
  skill: mail-harness
  kind: routine
  cadence: daily
  catch_up: coalesce
  watermark: last_attempt
  resources: [claude, gmail-inbox, sheet-a1, notion-bplan]   # scoring·deliver 초안 = claude -p [ADR 0003]
  stages: [sync, scoring, deliver]   # sync=접수·배분·기입 / scoring=판단 / deliver=드랍초안|후속미팅초안
  origin: system                     # 접수는 시스템 시작 · 드랍/후속은 approval 호출시 partner 로 override
  covers: [비플랜]
  status: partial
  notes: sync/drop ✅ · scoring(judge-bplan)·후속미팅 🔴 · A1 외부 커서(watermark_reader)

