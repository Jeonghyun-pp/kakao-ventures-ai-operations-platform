# 공유 자원별 상한 — kv_core.gate 가 읽는다.
#
# 이 파일은 **설정**이지 시크릿이 아니다(유출돼도 그 자체로 권한이 안 생긴다). 리포에 커밋한다.
# 자격증명은 $KV_CONFIG/.env 에 있다.
#
# 🔴 불변 규칙 02 — 세 숫자는 축이 다르다. 절대 같은 값으로 두지 마라.
#
#   | 항목                | 무엇을 보나          | 언제    | 걸리면              |
#   |---------------------|---------------------|--------|---------------------|
#   | preflight_max_usd   | 이번 런 **추정**     | 실행 전 | 공짜로 중단          |
#   | run_budget_usd      | 이번 런 **누적**     | 실행 중 | 이미 쓴 돈 회수 불가  |
#   | monthly_budget_usd  | 이번 달 **실청구액**  | 실행 전 | 공짜로 중단          |
#
# 🔴 [2026-07-28] monthly_budget_usd 는 **플랫폼 한도보다 높게 두면 무의미**하다.
#    gate 가 둘 중 낮은 쪽을 유효 천장으로 쓰고, 설정이 더 높으면 경고한다.
#    실측 당시 Apify 플랜(STARTER) 한도는 $29 였는데 net-sourcing 은 $45 로 알고 있었다.
#    → $29~$45 구간은 "가드가 있다고 믿지만 실제로는 없는 구간"이었다.

apify:
  # 계정 하나를 net-sourcing 과 ai-consumer-pulse 가 공유한다.
  # 배분은 하지 않고 총량으로 관리한다(선착순) — 예상 소비가 천장에 여유를 두고 들어가기 때문.
  #   net-sourcing ~$36/월 + ai-consumer ~$1.4/월 = ~$37.4
  # 부딪히기 시작하면 그때 스킬별 할당을 도입한다.
  monthly_budget_usd: 45.0      # ⚠️ 플랜 상향 전까지 실제 유효 천장은 $29 (gate 가 자동으로 낮은 쪽 사용)
  warn_at_pct: 80

  # 회당 가드는 스킬마다 규모가 달라 각 스킬 config.yaml 에 남긴다.
  #   net-sourcing      preflight $12  / run $16   (회당 추정 $10.5)
  #   ai-consumer-pulse preflight $0.8 / run $1.5  (회당 추정 ~$0.35)

# Anthropic 은 여기 없다 — 현재 전부 Claude Code 구독으로 돌고 종량 과금이 $0 이다.
# 무인화(W6)가 시작되면 구독 쿼터를 사람과 자동화가 나눠 쓰게 되므로 그때 다시 본다.
# 가정: Max 20x 쿼터가 무인화 부하를 흡수한다. 깨지는 증상 = 돈은 안 나가는데 아침에 사람이 막힘.
