# 데이터 보존 정책 — **무엇을 얼마나 오래 두는가.** 정본은 이 파일 하나.
# scripts/retention.py 가 읽어 집행하고, config/tasks.yaml 의 `retention` task 가 주 1회 부른다.
#
# ## 기준 (2026-08-16 실측으로 정함)
#
#   재수집 비용으로 가른다.
#     · 유료(Apify 원본)      → 영구. 재수집 = 돈
#     · 무료(애플 RSS/SSR)    → 짧게. 필요하면 다시 받는다
#     · 파생물(다른 곳이 정본) → 접는다
#     · 상태 정본            → 영구. 이게 [1] 계약의 본체다(크기 무시 가능, ~3MB)
#
# ## 🔴 안전 규약 — 삭제를 자동화한다는 것
#
#   ① `백업이 오늘 성공했을 때만` 지운다. 백업 없이 지우는 경로를 만들지 않는다.
#   ② 여기 선언된 glob **밖은 절대 안 건드린다**(화이트리스트).
#   ③ 지우기 전 개수를 세고, 남을 개수가 `min_keep` 미만이면 중단한다.
#
# 실측 기준선(2026-08-16): ~/kv-data 981MB · 실증가 ~33MB/일 → 1년 뒤 ~13GB

rules:
  - name: appstore-raw
    glob: "net-sourcing/raw/appstore_*.json"
    keep_days: 14
    min_keep: 3
    # 318MB(27본) · 하루 ~16MB 로 가장 크게 증가한다. 애플 RSS/SSR 은 무료라 다시 받으면 된다.
    # 🔴 이 기간이 곧 **컷 룰 소급 검증 가능 범위**다 — `cut_*` 압축본에는 판정 재료
    #    (raw_text·signals)가 없으므로, 룰을 고쳐 과거에 재적용하려면 이 원본이 필요하다.

  - name: appstore-snapshots
    glob: "net-sourcing/snapshots/*.json"
    keep_days: 90
    min_keep: 200
    # 8MB(3,778본). 보드 diff 의 "이전 시점" 기준이라 어느 정도 과거가 필요하다. 작다.

# 지우지 않는 것 — 왜 안 지우는지를 적어 둔다. 목록이 없으면 다음 사람이 "왜 이건 빠졌지"를
# 코드에서 유추해야 하고, 그러다 규칙에 넣는다.
never_delete:
  - path: "net-sourcing/raw/_actor/"
    why: "유료 Apify 원본 161MB. 재수집 = 돈. 파싱이 틀려도 $0 에 재분석하는 근거"
  - path: "*/jobs/**, */cadence/**, _approvals/**, _alerts/**, _usage/**, _locks/**"
    why: "[1] 상태 계약의 본체(events·cursor·워터마크·승인·알림·쿼터). 합쳐 ~3MB"
  - path: "ai-consumer-pulse/**"
    why: "2026-08-04 이후 정지. 살아나면 그때 정책을 정한다"
  - path: "_quarantine/**"
    why: "격리 보관소. 사람이 확인하고 지운다"

# cut_*.json 은 삭제가 아니라 **압축** 대상이라 여기 없다 — `scripts/compact_cuts.py` 참조.
