# LinkedIn — HarvestAPI 2엔진 (references/linkedin.md)
# 정책: 넓게 UNION → URN dedup → 소프트 스코어링 → judge. 여기서 하드컷 하지 말 것.
linkedin:
  # ══════════════════════════════════════════════════════════════════════════════
  # 2026-07-14 전면 재설계 — **서버측 극초기 필터를 켰다.**
  #
  # 🔴 무엇이 바뀌었나: 액터 입력 파라미터가 **41개**인데 우리는 **11개만** 쓰고 있었다.
  #   (`GET /v2/acts/harvestapi~linkedin-profile-search/builds/default` 로 스키마를 읽어라. 무료다.)
  #   안 쓰던 것 중 둘이 이 채널을 바꾼다:
  #
  #     yearsAtCurrentCompanyIds: ["1"]   → "Less than 1 year"  = **현 직장 재직 1년 미만만**
  #     companyHeadcount: ["A","B"]       → Self-Employed · 1~10명 = **회사 규모로 컷**
  #
  #   예전엔 300명을 사서 **사후에** 재직개월을 셌다 → 중앙값 18개월, 60%가 '스톡'(이미 오래
  #   Founder인 사람), 그리고 대기업 임원이 섞여 들어왔다("재직 0개월"이 방금 창업인지 방금
  #   이직인지 못 갈렸다 — 구글코리아 사장도 걸렸다).
  #   서버측 필터를 켜니 **재직 중앙값 6개월**, 회사명이 cPlat AI·TraceWeave·Anymorph·orbt 로 바뀐다.
  #   → **같은 돈으로 사는 사람이 통째로 달라진다.** 이게 이 채널의 유일한 큰 레버였다.
  #
  # ⚠️ `autoQuerySegmentation`(2,500 천장 우회)은 **일부러 안 쓴다.** 축당 주 25~250명이라
  #    천장 근처에도 안 간다. 우리의 제약은 천장이 아니라 **예산**이다. 검증 안 된 노브를
  #    커서 로직에 끼우면 부작용만 생긴다.
  #
  # 모수는 전부 **실측**이다(2026-07-14, Short 모드 1건 프로브 $0.10씩).
  # 다시 재려면: profileScraperMode=Short, maxItems=1 → `_meta.pagination.totalElements`
  # ══════════════════════════════════════════════════════════════════════════════
  #
  # `pages`  = 이번 실행에 읽을 페이지 수 (25명/page)
  # `rewind` = **true면 매 실행 p1부터 다시 읽는다** (플로우 축). 없으면 커서로 다음 구간.
  # `refresh`= 커서가 소진된 뒤 되감기 주기 (rewind 축엔 무의미)
  profile_search:
    # ── ① 플로우 축 — **신규 유입 감지기.** 모수 237명(10p) = 매 실행 전량 ──
    #   🔴 예전 `recent-job-kr`은 **되감기가 영영 안 걸렸다.** `refresh: weekly`라고 적어놨지만
    #      코드는 `exhausted`일 때만 되감는데, 주 1페이지씩 28페이지를 읽으려면 **28주**가 걸린다.
    #      → 이번 주에 직함을 Founder로 바꾼 사람이 이미 지나간 페이지에 있으면 **6.5개월간 안 보인다.**
    #      "실시간 신호"가 존재 이유인 축이 구조적으로 실시간을 못 잡고 있었다.
    #   ✅ 이제 `rewind: true` + 모수가 237명뿐이라 **전량(10p)을 매번 다시 읽는다.**
    #      이미 본 사람은 seen-store가 거른다 → 착지는 **신규 유입만**. 놓치는 게 0이다.
    # 💰 [2026-07-19] `always` → `biweekly` (비용 검증 D2, −$2.00/회 = −$4.33/월).
    #   이 축은 rewind라 매 실행 10p 전량 재구매($2.00)다. harvestapi payload에는 날짜
    #   파라미터도 제외 목록도 **없어서**(실측 키 13개) "이미 산 사람 빼고 사기"가 원리적으로
    #   불가능하다 — seen-store는 돈이 나간 **뒤** 거른다. 그래서 유일한 노브가 빈도다.
    #   ⚠️ 대가: tenure<6 감지가 늦어진다(링크드인 타깃 정답지 19명 전원이 그 조건).
    #      게다가 cadence는 고정 주기가 아니라 **최소 간격**이라, 수동 실행 리듬이 10일이면
    #      이 축은 14일이 아니라 **20일**마다 돈다. 지연이 길어 보이면 여기를 always로 되돌려라.
    - label: flow-new-founder
      cadence: biweekly
      rewind: true
      pages: 10                        # 모수 237명 = 10p → 전량
      currentJobTitles: [Founder, Co-Founder, Cofounder, CEO, CTO, "대표", "창업자", "공동창업자"]
      locations: ["South Korea"]
      recentlyChangedJobs: true
      yearsAtCurrentCompanyIds: ["1"]
      companyHeadcount: ["A", "B"]

    # ── ② Stealth 한국 — **요구사항 원문**("stealth startup 창업자 DB, 거주지 대한민국") ──
    #   🔴 극초기 필터를 **일부러 안 건다.** 스텔스로 2년째인 사람도 팔로업 대상이다
    #      (요구: "3-4개월 주기로 팔로업"). 재직기간으로 자르면 그 사람들이 사라진다.
    #   🔴 Stealth는 **직함이 아니라 회사명**에 박힌다(실측: 직함 0명 / 회사명 2명).
    #      그래서 `currentJobTitles`가 아니라 `searchQuery`(전문 검색)를 쓴다.
    - label: stealth-kr
      cadence: always
      pages: 4                         # 모수 444명(18p) → 커서로 ~4.5회에 순회
      refresh: monthly                 # 스텔스는 회전이 빠르다(회사명이 곧 실명으로 바뀐다)
      searchQuery: "Stealth Startup"
      locations: ["South Korea"]

    # ── ③ Stealth 미국 + 타깃스쿨 — **요구사항 원문**("거주지 미국 전체 + 서·연·고·카·포") ──
    #   🔴 옛 `kr-tie-global`은 `locations`가 **아예 없어서 전 세계**를 긁었다 —
    #      나이지리아·스웨덴·홍콩이 들어왔다. 요구는 "미국 전체"다.
    #   ✅ `schools` 서버측 필터는 **작동한다**(실측: 25명 중 24명이 서·연·고·카·포). 의심은 해소됐다.
    - label: stealth-us-krschool
      cadence: monthly                 # 모수 145명(6p) — 매주 돌 이유가 없다
      rewind: true
      pages: 6                         # 전량
      searchQuery: "Stealth Startup"
      locations: ["United States"]
      schools: ["Seoul National University", "KAIST", "POSTECH",
                "Yonsei University", "Korea University"]

    # ── ④ 극초기 스톡 — 모수 1,348명(54p). 커서로 매 실행 다음 구간을 판다 ──
    #   플로우 축이 "지금 막 바꾼 사람"을 잡는다면, 이 축은 **이미 극초기인 사람 전체**를 훑는다.
    #   재직<1년 + 1~10명이라 예전 t-founder(재직 중앙값 6.2년)와는 전혀 다른 집단이다.
    - label: early-kr
      cadence: always
      pages: 3
      refresh: quarterly
      currentJobTitles: [Founder, Co-Founder, Cofounder, CEO, CTO, "대표", "창업자", "공동창업자"]
      locations: ["South Korea"]
      yearsAtCurrentCompanyIds: ["1"]
      companyHeadcount: ["A", "B"]

    # ── ⑤ 최근 글 쓴 극초기 창업자 — "지금 움직이는 사람" ──
    #   ④의 부분집합(496명)이지만 **정렬이 달라서** ④의 커서에 아직 안 걸린 사람이 올라온다.
    #   별도 축(UNION)이라 순증이다.
    - label: posted-early
      cadence: always
      pages: 2
      refresh: monthly
      currentJobTitles: [Founder, Co-Founder, Cofounder, CEO, CTO, "대표", "창업자"]
      locations: ["South Korea"]
      recentlyPostedOnLinkedIn: true
      yearsAtCurrentCompanyIds: ["1"]
      companyHeadcount: ["A", "B"]

  post_search:
    # 영어 — 볼륨 크고 색인 확실. 작성자 위치로 한국만 남긴다
    - "excited to announce"
    - "we just launched"
    - "thrilled to share"
    - "our new startup"
    - "raised our seed"
    - "founding team"
    - "we're building"
    - "now in beta"
    # 한국어 — 되면 정밀도가 압도적. 0건이면 프로브로 원인 규명
    - "런칭했습니다"
    - "정식 출시"
    - "시드 투자"
    - "법인 설립"
    - "팀원을 찾습니다"
    - "베타 오픈"
