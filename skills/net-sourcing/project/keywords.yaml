# [B4] 채널별 창업/런칭 키워드 — 내일 확정. 아래는 시드 예시.
# judge와 분리: 여기는 "수집(소싱)" 단계에서 넓게 긁는 키워드. 판단은 core/judge가 담당.

# 스레드 — 3층 구조(references/threads.md). keyword=키워드 백본, following_seed_accounts=
# 팔로잉그래프 시드, reply_anchor_posts=리플라이 크롤 앵커. 두 발굴층은 단어를 안 써도 잡음.
threads:
  # ① 키워드 백본 — 넓게 잡는다. 홍보성 노이즈는 core/judge의 L0가 착지 직전에 걷어낸다.
  #    ⚠️ 액터는 OR·언어필터·네거티브 쿼리를 지원하지 않는다 → 쿼리 1개당 액터 런 1회(과금).
  #    수율은 2026-07-10 실측(고유작성자 99명 전수 라벨).
  # ══════════════════════════════════════════════════════════════════════════════
  # 2026-07-14 개정 — bio 백필로 **정답지**(빌더 60/513, 기저율 11.7%)가 생겨 처음으로
  #   키워드를 감이 아니라 **계산**으로 정했다. 근거: data/research/{threads_labeled,labels}.json
  #
  # 🔴 두 가지 메커니즘을 알고 고쳐라. 모르고 만지면 되돌아간다.
  #
  # ① **띄어쓰기 = OR.** 액터는 공백이 든 검색어를 **두 토큰으로 쪼개 OR 검색**한다.
  #    회수 글 본문에 그 말이 실제로 든 비율(=구 매칭률) 실측:
  #      공백형: 유저 인터뷰 0% · 1인 개발 0% · 앱스토어 심사 0% · 베타 오픈 0% · 창업 멤버 0%
  #              첫 유저 0% · 심사 리젝 2% · 바이브 코딩 5% · 법인 설립 14%
  #      붙임형: 웨이팅리스트 87% · 공동창업자 80% · 출시했습니다 74% · 피드백 71%
  #              사이드프로젝트 64% · 인디해커 55% · 바이브코딩 41%
  #    → "앱스토어 심사"가 **'심사'**만 매칭해 재건축 안전진단·시청 공약점검 글을 물어왔다.
  #    ⚠️ 단 **붙여쓰기는 필요조건이지 충분조건이 아니다**: '바이브 코딩'(공백)은 26.7%로 살아있고
  #       '만들었습니다'(공백 없음)는 0/22다. 진짜 결정 요인은 **"그 토큰을 빌더만 쓰는가"**다.
  #
  # ② **정체성 > 사건.** 빌더는 "나는 인디해커다"를 **반복해서** 말하지만 "출시했습니다"는 한 번만
  #    쓰고, 그마저 뉴스봇이 훨씬 많이 쓴다("OpenAI가 GPT-5.6을 출시했습니다").
  #      정체성: 인디해커 35.7% · 사이드프로젝트 35.7% · 바이브코딩 23~27%
  #      사건  : 출시했습니다 5.6% · 런칭했어요 0%
  #
  # 🔴 신규 추가 시 **킬룰을 먼저 등록**하라 (아래 kill_rules 참조). 1회 실행 빌더 0명으로
  #    죽이면 안 된다 — 기저율 11.7%에서 20명 뽑아 0명일 확률이 **8.3%**다(12번에 1번 오판).
  # ══════════════════════════════════════════════════════════════════════════════
  keyword:
    # ── 검증된 엔진 (배타 빌더 5명씩, 빌더당 $0.047) ──
    - "인디해커"           # 35.7% (5빌더/14라벨) — 공동 1위
    - "사이드프로젝트"      # 35.7% (5/14) — 공동 1위
    - "바이브 코딩"        # 26.7% (4/15) ⚠️ 공백형인데 최상위권이다. **건드리지 마라.**
    - "바이브코딩"         # 23.1% (3/13) — 위와 인물 교집합 **0명**이라 둘 다 필요하다

    # ── 유지 ──
    - "유저 인터뷰"        # 15.0% (3/20)
    - "첫 유저"           # 13.3% (2/15)
    - "피드백"            # 11.5% (3/26) ⚠️ 기저율(11.7%)과 동률 = **리프트 0**.
                          #   배타 빌더 2명·단가 $0.118이라 경제성만으로 유지. 킬룰 감시 대상.
    - "법인 설립"          # 5.9% (1/17) — 정밀도는 낮지만 @quantylab의 **유일 출처**
    - "출시했습니다"        # 5.6% (1/18) — 07-10에도 진성 2. 사건 단어의 한계치.
    - "런칭했어요"          # ⚠️ **보류.** 07-10 전수라벨 "진성 2/9" vs 07-13 "0/3"으로 두 실행이 어긋난다.
                          #   한 스냅샷으로 죽이지 않는다(사용자 지침). 다음 실행 결과를 풀링해 재판정.

    # ── 표기 교정 (구: "1인 개발" 5.6%) ──
    # 공백형이 '1인'만 매칭해 쓰레기를 물어왔다: "1인 1회 체험만 가능" · "1인 1대 선별" ·
    # "1인분 18.0원" · "진정 부러운 1인...오늘도 일나감". 반면 빌더 bio엔 붙임형이 실재한다
    # (@xavi.creator "1인개발자" · @octo_auto "1인개발 · 자동화" · @errorgamescom "#1인개발").
    - "1인개발"           # 🆕 롤백: 3회 누적 인물 <10명이면 "1인 개발"(공백)로 복귀

    # ── 🧪 신규 실험 슬롯 — **근거가 아니라 실험이다** ──
    # 정직 고지: 셋 다 코퍼스 858글에 **0건**이다. 그런데 코퍼스에서 편향 없는 글은 110개뿐이라
    #   (팔로잉그래프 120명 중 100명이 글 없음) **검정력 자체가 없다.** 최고 키워드 '인디해커'조차
    #   858글에 4번 나온다 — 사기 전이었다면 그것도 "코퍼스 0건"이었다.
    #   → 웹 리서치로는 사전 선별이 불가능하다. **사서 재는 수밖에 없다.** 킬룰로 손실을 묶는다.
    - "인디개발자"         # 🧪 인디해커(35.7%)와 같은 계열. 킬룰: 빌더의 80%+가 인디해커와 중복이면 삭제
    - "개인앱"            # 🧪 "회사 일 말고 내가 낸 앱". 노이즈 최저 예상. 관건은 **볼륨**
    - "앱인토스"          # 🧪 도구 고유명사. 살아있는 제품 없이는 못 쓰는 말.
                          #   ⚠️ author denylist에 @toss.appsintoss(토스 공식) 필수

  # 🔴 재추가 금지 — 실측 반증됨
  banned_keywords:
    - "테스트플라이트"      # 액터 0건 반환
    - "비공개 테스터"       # 액터 0건 반환
    - "웨이팅리스트"        # 15건 회수 → 빌더 0
    - "만들었습니다"        # 0빌더/22라벨. 2회 풀링 1/50 = 2.0% (기저율의 1/5.5)
    - "창업 멤버"          # 0/20 — 채용·구인글
    - "앱스토어 심사"       # 0/14 · 구매칭 0% ('심사'가 재건축·시청 공약을 물어옴)
    - "심사 리젝"          # 0/11 · 구매칭 2%
    - "베타 오픈"          # 0/10 · 구매칭 0%
    - "창업했습니다"        # 0/3 — **볼륨 사유**(3명 회수 = 회수 실패). 정밀도 사유 아님
    - "공동창업자"          # 0/2 — 볼륨 사유. 구매칭 80%인데 2명뿐 = 스레드에서 아무도 안 쓴다
    # ↓ 위 7개 합산 = 라벨 84명 / 빌더 **0명**. 기저율 하에서 우연일 확률 **0.0029%**.
    #   그리고 이 7개가 데려온 빌더 중 나머지가 못 잡는 사람 = **0명**(검증). 삭제 손실 0.
    #
    # ── AI 툴 이름 전 계열 (가장 중요한 반증) ──
    # 넓은 그물('클로드' 포함) 12히트/라벨 8명 → 빌더 **1명(12.5% = 기저율)**.
    # 실제 사용자: 강의팔이(@mind.engineer_ "돈 버는 법")·AI뉴스봇(@ax_lab_)·인프런 강사·콘텐츠 에디터.
    # → **툴 이름은 "만드는 사람"이 아니라 "툴 얘기로 먹고사는 사람"의 정체성 단어다.**
    # (덤: '커서'는 "키가 커서"·"마음이 커서" 활용형에 카페 창업글이 딸려온다)
    - "클로드코드"
    - "커서"
    - "러버블"
    - "코덱스"
    - "안티그래비티"
    - "바이브코더"
    - "솔로프리너"          # 코퍼스 1건, 그 1명이 강의팔이 크리에이터. bio 635건 중 0건
    - "앱스토어"           # 단독형 = **장소 명사**. 빌더 0/1, 국가장학금 앱 설치 안내 슬롭이 옴
    # 사람들은 본문엔 **띄어** 쓴다("앱 개발"·"인앱 결제") → 붙임 쿼리는 회수 0
    - "앱개발"
    - "인앱결제"
    - "노코드"             # 코퍼스 0명

  # 🔴 신규 키워드 킬룰 — **사전등록.** 1회 0명으로 죽이지 마라(오판률 8.3%).
  #   판정 단위는 "실행 횟수"가 아니라 **누적 유니크 라벨 인원 n**이다
  #   (쿼리마다 회수량이 5~30명으로 달라, 횟수 기준은 볼륨 큰 쿼리를 부당하게 빨리 죽인다).
  kill_rules:
    gate_a_volume:  "3회 실행 누적 유니크 인물 < 10명 → 삭제 (정밀도와 무관. 회수가 없으면 끝)"
    gate_b_n25:     "누적 라벨 25명에서 빌더 0명 → 삭제 (오판률 4.5%). ≥3명(12%) → 유지. ≥6명(24%) → 승격"
    gate_c_n40:     "누적 40명에서 빌더 ≤2명(≤5%) → 삭제. 진짜 25%짜리가 여기 걸릴 확률 0.5%"
    measure:        "회차마다 **구 매칭률**(회수 글 본문에 검색어가 실제로 든 비율)을 찍어라.
                     5% 미만이면 정밀도 판정 전에 **표기 문제**로 확정하고 붙임/공백을 바꿔라."

    # ── 삭제 (사람이 아니라 외국인 잡담이 옴) ──
    # "Day 1"     → 고유 25명 전원 비한국어 잡담(크리켓·여행·금주 1일차). 사람을 못 긁는다
    # "오늘 런칭"  → 사실상 "런칭" 단독이라 화장품/골프 프로모션만. "런칭했어요"가 이미 커버
    #
    # ⚠️ 위 확장 키워드 다수는 노이즈가 크다(강의팔이·콘텐츠팜·자영업).
    #    **그건 수집에서 자를 문제가 아니라 judge가 거를 문제다.** 목표는 "홍보성 쓰레기만 빼고
    #    최대한 많은 사람"이므로, 사람이 긁히는 키워드는 노이즈를 감수하고 넣는다.
    #    2주 뒤 실측(작성자 수 / 진성 수)으로 재판정한다.
  # ── 워치리스트 시드 (@ 없이 username만) ──
  # burbn의 `from` 파라미터로 **이 사람들의 새 글을 매일 본다.** 키워드를 안 써도 잡힌다.
  # 로그인 불필요 — 팔로잉그래프 층(sessionId 쿠키 필수)의 대체재다.
  #
  # 아래는 2026-07-10 수집 99명 전수 라벨에서 **진성 창업자로 확인된 사람들**이다.
  # (자동 등록: config의 watchlist_triggers — 위조 불가 어휘를 쓴 사람이 자동으로 추가된다)
  watch_accounts:
    - zenonplane          # 조종사 · 주짓수 로그북 앱(BJJ Log10) 직접 출시
    - sunday_builders     # 대학생 3인팀 · 사업자 등록 · 토스 서비스 2개 — 유일하게 명확한 '팀'
    - 820_nam             # 와글(waggle.lol) · 사이드프로젝트 팀매칭
    - cat.didit           # 눈건강 알림 앱
    - mindradar_          # AI 감정일기 · 라이브 URL + 피드백 요청 — 발굴 정의에 가장 정확히 부합
    - starry_android      # 주식 지표 앱 · 본인 필요로 앱을 만드는 사람
    - wondesign_studio    # 수영장 예약 서비스
    - jakecoldbyte        # 깃밥(gitbap.com)
    - mj.won.dev
    - developerh4807

  # ② 팔로잉그래프 시드 — **"누가 무슨 말을 했나"가 아니라 "누구와 연결됐나"로 찾는다.**
  #    [2026-07-12] '원천 봉쇄' 판정은 거짓이었다: 무로그인 액터(igview-owner,
  #    required=['username'])가 실재한다. 봉쇄된 건 팀이 고른 액터 하나뿐이었다.
  #
  #    시드 = **이미 진성으로 확인된 한국 빌더**(위 watch_accounts와 동일 명단).
  #    이들이 팔로우하는 계정 = 같은 씬의 다른 빌더 → 키워드를 한 글자도 안 써도 잡힌다.
  #    이 층의 존재 근거는 **순증 인원**이다 — 확장 결과 중 키워드 층이 이미 아는 사람을 빼고
  #    몇 명이 남는가. 어댑터가 매 실행 그 숫자를 찍는다(0이면 이 층은 재방문에 불과하다).
  #    🔴 [2026-07-13] 시드는 **팔로잉 목록이 열려 있어야** 쓸모가 있다. 글을 쓰는 것과 다르다.
  #      `mindradar_`를 뺐다 — 2회 실측 모두 **팔로잉 0건**(비공개이거나 아무도 안 팔로우).
  #      실행당 $0.16을 태우고 매번 "🔴 액터 파손/차단 의심" 경고를 띄워, **진짜 사고를 가린다.**
  #      ※ watch_accounts 에는 **남겨뒀다** — 글은 쓰고 있을 수 있다(아직 한 번도 안 가져와봤다).
  #        시드(=팔로잉을 본다)와 워치(=글을 본다)는 요구 조건이 다르다.
  #
  # ══════════════════════════════════════════════════════════════════════════════
  # 🔴 2026-07-14 재설계 — **이 층은 정밀도 1위였다.** 어제 "말차라떼가 나온다"고 폐기하려 했던 건
  #   샘플 3개로 분포를 판단한 오진이었다. 정답지(빌더 라벨)로 세어보니:
  #     following_graph 21빌더/110명 = **19.1%**  ← 1위
  #     keyword_search  29빌더/253명 = 11.5%
  #     reply_crawl      5빌더/ 80명 =  6.2%
  #   그리고 **FG 빌더 21명 ∩ 키워드 빌더 = 0명.** 전체 빌더 60명의 35%를 이 층 혼자 물어왔고,
  #   키워드 18개가 **한 명도** 못 잡은 사람들이다(@programmingzombie 앱300개·@gojaehyun.go 앱50개·
  #   @un.bound6 9개앱 200만다운·@godok.eagle 1인사업 10년).
  #
  # 🔴 그런데 진짜 원인은 층이 아니라 **허브 계정 하나**였다. 팔로잉 액터 런 10개 실측:
  #   | 시드 | 빌더 | 정밀도 | 판정 |
  #   | sunday_builders | 17 | **41.5%** | bio="🛠️ 일요일에 무언가를 만드는 사람들" = **커뮤니티 허브** |
  #   | jakecoldbyte    |  5 | 25.0% | 팔로잉의 28%만 봤다 → 헤드룸 최대(Chapman N̂≈191) |
  #   | 820_nam         |  4 | 15.4% | 94% 소진. $0.62/빌더로 손익분기(1.76빌더/런) 미달 |
  #   | zenonplane      |  0 | **0.0%** | 팔로잉이 조종사·주짓수 씬 |
  #   → **"팔로잉그래프가 정밀한 게 아니라 허브 계정이 정밀하다."**
  #     sunday_builders 하나가 이 층 빌더 21명 중 **17명**을 데려왔다.
  #
  # ⚠️ 시드 선정 규칙은 **만들 수 없다**(n=4). 최고 시드는 팔로워 38명짜리 **커뮤니티 계정**이고
  #   (is_builder=false!) 최악 시드는 **확인된 빌더**다. 팔로워 수도 신호가 아니다(38 < 268).
  #   zenonplane의 bio는 **빈 문자열**이라 bio로도 사전 예측이 안 된다.
  #   → **공짜 예측자는 존재하지 않는다. $0.162로 사서 재는 수밖에 없다.**
  #     대신 킬룰이 손실을 1런에 묶는다(아래 seed_kill_rule).
  #
  # 🔴 같은 시드를 **반복 실행하면 새 사람이 온다.** max_following=30은 천장이 아니라 **랜덤 표본**이다
  #   (jakecoldbyte는 34분 간격 2런의 겹침이 4/30뿐). "팔로잉 목록은 1회성 stock"이라는 가설은 반증됐다.
  #   → 좋은 시드는 **여러 번** 돌린다. 아래 `runs` 가중치.
  # ══════════════════════════════════════════════════════════════════════════════
  following_seed_accounts:
    # runs = 이번 실행에서 이 시드를 몇 번 돌릴지. 1런 = $0.162 = 최대 30명.
    - {username: jakecoldbyte,    runs: 3}   # 25.0% · 28%만 봄(N̂≈191) → 헤드룸 최대
    - {username: sunday_builders, runs: 2}   # 41.5% ⭐ 허브 계정 · 64% 봄(N̂≈68)
    # 🔴 제거: zenonplane (0빌더/30 — 팔로잉이 주짓수·비행 씬)
    # 🔴 제거: 820_nam    (94% 소진 · $0.62/빌더 = 손익분기 3.8배 미달)
    # 🔴 제거: mindradar_ (팔로잉 0건 2회 실측 — 비공개)
    #   ※ 넷 다 watch_accounts 에는 **남긴다.** 시드=팔로잉을 본다 / 워치=글을 본다. 요구가 다르다.

  # 🧪 시드 트라이얼 — 매 실행 신규 시드를 실험한다. 안 하면 이 층은 3~4회 뒤 마른다
  #   (현 2시드의 총 주소가능 인구 N̂≈259명, 이미 97명을 봤다 → 남은 빌더 총량 ≈45명).
  following_seed_trials:
    # 후보 근거: 서로 다른 2개 시드가 **공통으로 팔로우**한 계정 = 전 우주에 딱 3명. 전원 빌더.
    - programmingzombie   # 팔로워 17,007 · "300개의 앱으로 개발 7년차에 직장 퇴사"
    # ⚠️ 위는 **개인 빌더 아키타입**(실측 수율 0~25%)이다. 압도적 1위는 **씬/커뮤니티 계정**
    #   아키타입(41.5%)인데, 그걸 무과금으로 더 찾는 방법은 없다(bio 스캔하면 마케터·대기업공식·
    #   스윙댄스 동호회가 나온다). → 아래 한 자리는 **사람이 손으로** 넣어라.
    #
    # ══ 2026-07-21 사람이 손으로 넣음 — 웹서치로 찾은 '씬/커뮤니티 허브' 후보 4개 ══
    #   채점 기준: 팔로잉 목록이 극초기 한국 빌더로 빽빽한가(유명세·팔로워수 무관).
    #   판정: 각 1런($0.162)씩 사서 재고 seed_kill_rule(30명 중 빌더 0 → blacklist)로 손실 유계.
    #   🔴 웹서치는 '정체성'만 확인 — 팔로잉 공개 여부/빌더 밀도는 실런으로만 안다.
    - syde.kr             # 🟢 SYDE 사이드프로젝트/솔로프리너 커뮤니티 1,400+ · sunday_builders 판박이(최우선)
    - indiehack.kr        # 🟢 인디해커(1.2K·前 KAIST→SV개발자) · 같은 씬 팔로우 확률 높음
    - disquiet_io         # 🟡 디스콰이엇 메이커 네트워크(프로덕트 5,000+) · ⚠️스레드 활동성/팔로잉 공개 확인 필요
    - eostudio.kr         # 🟡 EO Korea(김태용 미디어) · ⚠️미디어라 팔로잉이 '이미 유명한 창업자'일 위험
                          #   → 이건 빌더율이 아니라 **극초기 순증**으로 채점하라(순증 낮으면 blacklist)

  # 🔴 시드 킬룰 — **사전등록.** 1런(30명) 수확에 빌더 0명이면 즉시 blacklist.
  #   근거: 층 기저율 19.1%에서 30명 중 빌더 0명일 확률 = **0.5%** → 오판 위험 1/200.
  #   zenonplane이 정확히 이 룰에 걸린다(0/30). 손실은 $0.162로 유계다.
  seed_kill_rule: "1런 수확 30명 중 빌더 0명 → 즉시 blacklist ($0.162 손실로 종결)"
  # ③ 리플라이 앵커 — "요즘 뭐 만드세요?"류 포스트의 **댓글**을 긁는다. 리플라이로만 런칭을
  #    알리는 미접촉 창업자를 잡는다(그 글의 댓글은 이미 의도 신호가 강해 오탐이 낮다).
  #
  #    ⚠️ 여기 손으로 URL을 채우는 건 지속가능하지 않다(글은 매주 새로 생긴다).
  #    → **자동 수확**: keyword 층이 가져온 글 중 댓글이 anchor_min_replies 이상 달린 글을
  #      다음 실행의 앵커로 자동 등록한다(data/threads_anchors.json). 아래는 수동 시드(선택).
  #      계정이 아니라 **글 URL**이어야 한다: https://www.threads.com/@handle/post/XXXX
  reply_anchor_posts: []

