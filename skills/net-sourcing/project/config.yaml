# net-sourcing 설정 — 핸드오프 1파일.
# 값 대부분은 [결정 A~G]로 표시된 내일 결정 항목. 확정 전 임시 기본값.

discoverer_user_id: "user://TODO"        # [D4] 발굴자 Notion user id (기본 발굴자)
reviewers: []                            # [D4] 만나요 후보 심사역 user id (보통 회의에서만 채움)

# ★ [2026-07-17] 팔로업 — 재조우(이미 착지한 사람이 다시 잡힘)를 표면화한다.
#   스레드=새 글 병합 · 링크드인=프로필 변화가 기존 행에 PATCH될 때 Last Seen(date)·재검토(checkbox)를
#   찍는다(core/notion.land). 🔴 재검토는 **코드가 켜기만** 한다 — 확인 후 끄는 건 사람이다.
#   롤백: enabled: false 한 줄 (코드 revert 불필요. 이미 찍힌 값은 무해하게 남는다).
followup:
  enabled: true
  touch_on_duplicate: false              # 순수중복(새 글 0·변화 0)에도 Last Seen만 갱신할지.
                                         # 기본 off — 중복 인원수만큼 PATCH가 늘어 착지가 느려진다(0.34s/건).
                                         # Last Seen의 의미는 "마지막 관찰일"이 아니라 "마지막 **새 정보** 착지일".

# ★ [2026-07-17] 팔로업 ② — `main.py recheck`: 알려진 스레드 인물의 bio만 다시 사서($0.005/인)
#   텍스트 diff. 변화만 재검토 ✅. **수동 전용**(크론/파이프라인 연결 없음 — 안 부르면 죽은 코드).
#   극초기 창업자는 런칭할 때 bio를 새로 쓴다 — 그 전이가 신호다. 의미 판단은 judge/LLM 몫.
recheck:
  cadence:
    priority_days: 30                    # 타깃 ✅ 또는 Tier=Catch → 월간
    builder_days: 90                     # 그 외 빌더 ✅ → 분기 (그 외 인물은 재확인 안 함 — 재조우가 커버)
    # ★ [2026-07-19] 빈-bio 재확인 주기. **tools/backfill_bio.py 가 읽는다**(recheck.py 아님).
    #   07-17에 빈-bio 125명(19.6%)의 재구매를 Last Checked 마킹으로 막았는데, 주석은
    #   "나중에 bio를 채우면 recheck의 TTL이 잡는다"고 적혀 있었지만 recheck 필터는
    #   타깃/빌더/Tier=Catch 3군뿐이라 **셋 중 아무것도 아닌 빈-bio 계정은 영구 제외**였다.
    #   → 런칭하면서 bio를 새로 쓰는 극초기 창업자를 영영 놓친다. 그게 이 노브의 이유다.
    #   비용: 125명 × $0.005 = $0.63을 90일에 한 번 = **~$0.21/월**. 0으로 만들지 마라.
    empty_bio_days: 90
  max_people: 100                        # 1회 상한 = $0.50. 초과분은 다음 실행에(우선군→오래된 순).
  batch: 50                              # backfill_bio와 동일한 배치 크기

  # ★ [2026-07-20] **워치리스트 폐기 시 편입된 명단.** 이들은 타깃/빌더/Tier 어디에도 안 걸리지만
  #   워치리스트 로스터가 보고 있던 사람이다(큐레이션으로 뽑은 진성 한국 빌더 —
  #   keywords.yaml watch_accounts 주석 참조). 레인을 없애면서 그냥 두면 **조용히 사라진다.**
  #
  #   🔴 왜 `빌더 ✅`를 찍어서 편입하지 않았나: 그 체크박스는 **정답지**다(빌더 60명으로
  #      judge 정밀도/재현율을 잰다). 코드가 찍으면 정답지가 오염되고, 그 뒤로는 어떤 측정도
  #      믿을 수 없게 된다. 라벨을 건드리는 대신 **대상군 규칙을 넓히는 게** 맞다.
  always_include:
    - zenonplane          # 주짓수 로그북 앱(BJJ Log10) 직접 출시
    - sunday_builders     # 대학생 3인팀 · 사업자 등록 · 토스 서비스 2개
    - 820_nam             # 와글(waggle.lol) · 사이드프로젝트 팀매칭
    - mindradar_          # AI 감정일기 · 라이브 URL + 피드백 요청
    - starry_android      # 주식 지표 앱
    - wondesign_studio    # 수영장 예약 서비스
    - mj.won.dev
    - developerh4807
    - tigerjhr            # 자동 워치리스트에서 승격돼 있던 계정

notion:
  # 소싱 에이전트 착지 = 그물망 소싱 DB(채널별 스키마 완비: Channel/Author*/App ID/Genre…).
  # "스킬 한 번 실행 → 3채널 raw를 이 DB에 Channel 태그로 전량 착지"의 대상.
  db_id: "00000000-0000-0000-0000-d609b10d8459"   # 그물망 스타트업 소싱 DB (신규·정식, 2026-07-10 생성, 'plan' 공유·GET 200 확인). REST는 DB id를 받음(데이터소스 1109e2da 아님)

  # ★ [2026-07-14] **채널별 착지 DB.** 없는 채널은 위 db_id(기본)로 간다.
  #   왜 나눴나 (core/notion.db_for 주석에 근거 전문):
  #     · 단위가 다르다 — 1행=앱 / 1행=사람. 섞이면 "총 N행"이 의미 없는 숫자다.
  #     · 판단 흐름이 다르다 — 앱스토어는 **판단 없는 보드**(Tier 없음), 사람 채널은 Tier 대상.
  #       같은 빈칸인데 뜻이 정반대였다("원래 맞는 것" vs "아직 안 한 것").
  #     · 물량이 압도한다 — 앱스토어가 하루 수십~수백 행씩 쌓여 사람 채널을 묻는다.
  #     · 속성 49개 중 앱스토어가 쓰는 건 23개뿐. 새 DB는 **19칸**이다.
  #   ⚠️ 통합 DB의 유일한 명분이던 **교차 dedup은 원래 작동한 적이 없다**(실측: 키가 전부
  #      채널 전용 — app:/li:/name:). **나눠도 잃는 게 0**이라는 게 분리의 근거다.
  #   ★ [2026-07-15] **스레드·링크드인도 채널별 DB로 분리**(사용자 결정: "앱스토어처럼 만들자").
  #      기존 행은 **이관하지 않는다**(사용자 결정: "신규만 새 DB로" — 앱스토어 선례와 동일).
  #      → 기존 Threads 635·LinkedIn 344행은 기본 DB(10fb616a)에 남고, **앞으로 잡히는 것만**
  #        새 DB로 간다. 이미 아는 사람이 또 잡히면 **자기 기존 행(기본 DB)에 계속 누적**된다.
  #      🔴 이게 성립하려면 **층② dedup이 전 착지DB를 봐야 한다**(notion.existing_landing_keys가
  #         landing_dbs 전부를 스캔). 안 그러면 기존 635명이 새 DB에 중복 재생성된다. 그 코드가
  #         이 분리와 한 몸이다 — 함께 유지하라.
  channel_db_ids:
    앱스토어: "00000000-0000-0000-0000-30deea8edcc5"   # 그물망 앱스토어 소싱 DB (19칸 · `판정` 포함)
    스레드:   "00000000-0000-0000-0000-a258370d87f8"   # 그물망 스레드 소싱 DB (35칸 · 인물 1행 + 본문 글 누적, 2026-07-15 생성)
    링크드인: "00000000-0000-0000-0000-8702f7cc7f34"   # 그물망 링크드인 소싱 DB (24칸 · Tenure/Axis, 2026-07-15 생성)
  # (구 테스트 DB 36c0ac54 → 폐기, 테스트페이지였음)
  weekly_db_id: "00000000-0000-0000-0000-d609b10d8459"  # [D1 확정] 주간 DB=그물망 소싱 DB. LinkedIn URL·주차 property 추가됨(2026-07-10). dedup ①단 대상
  # [②단 dedup — "이미 아는 사람 제외"] 2026-07-12 수정: 기존 두 ID는 **404였다.**
  #   원인은 '인티그레이션 미공유'가 아니라 **UUID 오기**였다(라이브 GET으로 확정).
  #   아래 두 개는 GET 200 · 실행 시점 행수를 확인한 실제 DB다.
  earlystage_db_id: "00000000-0000-0000-0000-72b2b8579963"   # 극초기 스타트업 DB (1,274행, title='법인(서비스)') → 회사명 대조
  startup_db_id: "00000000-0000-0000-0000-36ea38d63b9f"      # ⚠️ 이름은 startup인데 **실제 값은 Bplan 3.0**이다(역사적 혼동). 아래 dedup_db_ids가 정본.

  # ★ [2026-07-21] **②단 dedup 대조원 정본.** 여기 {label,id}를 추가하면 코드 수정 없이 대조원이 는다.
  #   왜 생겼나: 예전엔 core/notion.py가 위 두 키를 **하드코딩**해 읽었고, 그래서 **본 스타트업 DB와
  #   Bplan 2.0이 대조에서 통째로 빠져 있었다.** 사용자가 "Example Person J는 스타트업 DB에 있다"고 지적해 발각 —
  #   우리 대조는 그 DB를 볼 수조차 없었다(통합 미공유 404). 부분 실패도 이제 🔴로 소리를 낸다.
  dedup_db_ids:
    - {label: "극초기 스타트업 DB", id: "00000000-0000-0000-0000-72b2b8579963"}   # title=법인(서비스)
    - {label: "Bplan 3.0 DB",    id: "00000000-0000-0000-0000-36ea38d63b9f"}   # title=기업명 + 대표명
    - {label: "Bplan 2.0 DB",    id: "00000000-0000-0000-0000-ef5f37517c6a"}   # title=회사명(서비스명) · 대표 property 없음
    # ★ 본 스타트업 DB(투자검토·포트폴리오). title=회사명 · 사람이름 property=`✅ 대표이사`
    #   🔴 2026-07-21 공유 후 실측: 예전에 메모리에 적혀 있던 `3f93fa14…`는 **collection id라 404**였다.
    #      database id는 `fbe0eae4…`다. 노션 UI에서 복사한 링크의 id가 collection id인 경우가 있으니
    #      대조원을 추가하면 **첫 실행 로그에서 '회사명 N건'이 실제로 찍히는지 반드시 확인할 것.**
    - {label: "스타트업 DB(본DB)", id: "00000000-0000-0000-0000-3b327e053219"}
  # ★ 사람 이름 대조 — 링크드인 착지 행의 제목은 **사람 이름**(97/97)인데 대조 DB 제목은
  #   회사명이라 축이 안 맞았다. title 말고 아래 property도 읽어 name: 키를 만든다.
  # ★ 사람이름 property 후보. **정확일치가 아니라 정규화 매칭**이다(core/notion._title_keys).
  #   실측: 스타트업 DB의 속성명이 `✅ 대표이사`라 정확일치로는 영영 안 걸렸다(✅·공백 때문).
  dedup_name_props: ["대표명", "대표이사", "대표"]
  land_status: "New"                     # land 시 부여할 Status(select). 판단 에이전트가 이후 변경.
  unreviewed_status: ""                  # [D3] (극초기 DB용) 미검토 표현

apify:
  # [결정2/프록시] none=주입 안 함(현행·무료). datacenter=플랜 포함/저가. residential=유료 $8/GB.
  # 데이터센터 IP 차단이 의심되면(0건 HEALTH 경고 다발) residential로 전환. 전환은 이 한 줄.
  proxy: "none"                          # none | datacenter | residential
  proxy_country: ""                      # residential일 때만 의미: "KR" | "US" ...

  # 🔴 [비용 하드캡 2026-07-13] 07-10에 burbn 6런이 $5.94를 태워 무료 한도($5)를 넘겼고
  #    그때부터 두 채널이 403으로 죽었다. 코드에 상한이 **한 줄도 없었다.**
  # 🔴 두 숫자는 역할이 다르다. **같은 값으로 두지 마라.**
  #   preflight_max_usd — 실행 **전** 게이트. 추정이 넘으면 **한 푼도 안 쓰고** 중단한다.
  #     여기서 막는 건 공짜라 빡빡하게 잡아도 손해가 없다. 이게 진짜 "예산"이다.
  #   budget_usd       — 실행 **중** 폭주 차단선. 여기 걸리면 **이미 쓴 돈은 못 돌려받고**
  #     뒤쪽 채널(링크드인)만 0건이 된다. 그래서 추정에 딱 붙이면 안 된다 —
  #     정상 변동(+40%)은 통과시키고 액터가 아이템을 10배 뱉는 **사고**만 잡는 높이여야 한다.
  #   [2026-07-14] 링크드인 재설계(극초기 서버측 필터 + 플로우 축 전량 되감기)로 링크드인 런이
  #   12 → 25회가 됐다. 추정 $10.74 · **천장 $13.87**.
  #   🔴 차단선을 14.0에 두면 천장과의 여유가 **$0.13**뿐이라 백스톱이 백스톱이 아니게 된다
  #      (액터가 아이템 몇 개만 더 뱉어도 전역이 터지고, 터지면 뒤쪽 채널이 통째로 0건이다).
  #      → 차단선을 천장 **위로** 올린다. 게이트(12)는 그대로 — 추정을 조이는 건 게이트의 일이다.
  #   현재: 추정 $10.74 → 게이트 $12(여유 12%) · 천장 $13.87 → 차단선 $16(여유 15%).
  #   (평시 실행은 $9.54다. stealth-us-krschool 축이 monthly라 estimate는 **최악치**를 잡는다.)
  preflight_max_usd: 12.0
  budget_usd: 16.0

  # ★ [2026-07-20 결정 12] **월 예산 상한.** 위 둘과 축이 다르다 — 셋을 헷갈리지 마라.
  #
  #   | | 무엇을 보나 | 언제 | 걸리면 |
  #   |---|---|---|---|
  #   | preflight_max_usd $12 | **이번 런 추정** | 실행 전 | 공짜로 중단 |
  #   | budget_usd $16        | **이번 런 누적**(추정) | 실행 중 | 이미 쓴 돈은 못 돌려받음 |
  #   | **monthly_budget_usd $45** | **이번 달 실제 청구액** | 실행 전 | 공짜로 중단 |
  #
  #   🔴 **왜 이게 필요한가**: 결정 #6(수동 실행)이 지금까지 사실상 월 예산 가드였다 —
  #      사람이 매번 "이번 주에 돌릴까"를 판단하는 게 월 총액을 누르는 유일한 장치였다.
  #      **크론은 그 사람을 없앤다.** 회당 가드는 12번 돌면 12배가 나가는 걸 못 막는다.
  #
  #   기준은 **Apify 실제 누적**(`GET /users/me/limits` → monthlyUsageUsd)이다. 우리 추정이 아니라
  #   진짜 청구액이라, 추정이 틀려도(액터 오버슛 +15% 등) 이 가드는 안 속는다.
  #   판정식: `실제누적 + 이번런추정 > monthly_budget_usd` → 차단.
  #   사람은 `--force-budget`으로 우회할 수 있고 **크론은 못 쓴다**(그게 이 플래그의 요점).
  #
  #   ⚠️ 사용량을 못 읽으면(네트워크·토큰 문제) **크게 경고하고 통과시킨다**(fail-open).
  #      막아버리면 Apify API 딸꾹질 한 번이 수집을 통째로 죽인다. 통과시켜도 회당 가드가
  #      한 번의 손해를 $16으로 묶으므로, 조용히 죽는 것보다 시끄럽게 도는 게 낫다.
  monthly_budget_usd: 45.0
  default_memory_mb: 1024                # 액터별 override 없을 때

  # ⚠️ **지금 config는 burbn 기준 $18.77이라 예산을 넘어 collect가 막힌다.** 의도된 상태다.
  #    burbn은 minMemory 4096이라 런당 $0.16이 **고정**이고, 스레드 4개 층은 런이 52회 나온다
  #    (시작 수수료만 $8.32 — 비용의 정체는 데이터가 아니라 '런을 여는 값'이다).
  #    → 전 층을 $10 안에 넣으려면 배치 액터로 스왑해야 한다. 두 갈래:
  #
  #  ① 권장 — 결제 후 첫 행동: `./.venv/bin/python tools/probe_actor.py`  (~$0.40)
  #     meta-threads 출력이 파서에 걸리면 actors.keyword/user_posts 를 그걸로 바꾼다.
  #     → 워치리스트·팔로잉 글이 **런 1회**로 끝나고 전 층 1회 = **~$7.7** (범위 축소 없음)
  #
  #  ② 프로브가 실패하면 (burbn 유지) — 아래로 좁혀야 $10에 든다. **발굴 폭이 준다:**
  #     channels.threads.max_posts: 15              (40 → 15)
  #     channels.threads.layers: [keyword, following_graph, replies]   (watchlist 제거)
  #     channels.threads.following_posts_budget: 5  (15 → 5)
  #     channels.threads.replies_max_anchors: 8     (20 → 8)
  #     channels.linkedin.profile_search.scraper_mode: "Short"   (Full → Short, 학력 못 봄)
  #     → ~$8.9. 매번 tools/estimate_cost.py 로 재확인할 것.

  # 액터별 실행 옵션. memory_mb는 **아무 값이나 못 넣는다** — 액터 minMemoryMbytes 미만이면
  # 400이 나고 그 채널이 통째로 0건이 된다(로그는 '쿼터 초과'처럼 보인다).
  # 실측(GET /v2/acts/{slug}/builds/default, 2026-07-13):
  #   Apify는 actor-start를 **메모리 GB당 1회** 과금한다. burbn이 기본 4096MB(=최소치)로 돌아
  #   런마다 start를 4회($0.16) 물고 있었다. 이게 비용의 정체였다 — 아이템 값이 아니라 시작 수수료.
  # price_per_item / start_usd 는 **BRONZE(유료 최하위) 티어 단가**. 무료 티어면 4배 비싸다.
  actors:
    # 🔴 max_charge_usd = **런당 추정 × 1.3**. 이건 Apify가 액터를 강제로 멈추는 값이다.
    #   · 너무 낮으면(캡 < 추정) 액터가 **중간에 잘려서** 데이터를 덜 준다. 조용히.
    #     실제로 그랬다: meta 캡 $0.60 < following(글) 추정 $0.77 → 22% 손실이 숨어 있었다.
    #   · 너무 높으면 Σ(런×캡)='천장'이 전역 차단선(budget_usd)을 넘어, **정상 실행에서도**
    #     전역이 터진다 = 뒤쪽 채널 통째로 0건.
    #   두 실패가 반대 방향이라 1.3배가 균형점이다. 바꿀 땐 `tools/estimate_cost.py`가
    #   천장 < 차단선 인지 **기계로 검사**한다 — 어기면 rc=1로 수집이 시작조차 안 된다.
    #   ⚠️ 한 액터를 여러 층이 공유하면(meta = watchlist + following글) 캡은 **가장 큰 층 기준**이다.
    #
    # 최소 4096MB. 못 내린다 → start $0.04×4GB = **$0.16/런**. 21키워드면 시작 수수료만 $3.36.
    "burbn~threads-search-scraper":                      # 롤백용 — 현재 미사용
      {memory_mb: 4096, start_usd: 0.04,  price_per_item: 0.005, max_charge_usd: 0.40}
    # ★ 스왑 후보. 같은 4GB인데 start 단가가 1/8($0.005/GB=$0.02/런), 아이템도 절반.
    #   게다가 keywords/usernames를 **배열**로 받아 여러 대상을 한 런에 처리한다
    #   → 팔로잉그래프의 "60명 = 런 60번 = $9.60" 문제가 통째로 사라진다.
    #   ⚠️ 출력 스키마 미검증. 결제 후 첫 행동 = 이 액터 프로브(같은 키워드로 burbn과 대조).
    # 두 층이 공유한다: watchlist + following(글). 둘 다 20명씩 쪼개 런당 ~100아이템 → $0.27/런.
    # → 캡 $0.27×1.3 = $0.35. (max_posts를 인원수만큼 곱하던 버그를 고치기 전엔 런당 $0.77이었다)
    "futurizerush~meta-threads-scraper":
      {memory_mb: 4096, start_usd: 0.005, price_per_item: 0.0025, max_charge_usd: 0.35}
    # 5런 × 런당 추정 $0.16 → 캡 $0.21
    "igview-owner~threads-user-following-scraper":
      {memory_mb: 4096, start_usd: 0.003, price_per_item: 0.005, max_charge_usd: 0.21}
    # ★★ [스모크 2026-07-13] **burbn의 대체재.** 스토어 조사 + 실측으로 확정:
    #   · 출력 키가 burbn과 **8/8 동일**(captionText·postUrl·takenAtISO·likeCount…) → 파서 변경 0
    #   · 입력도 동일(searchQuery·sort·from·after·maxPosts)
    #   · **메모리 최소 선언이 없다 → 1GB로 실행 가능** → start가 1회만 청구($0.005)
    #     burbn은 4GB 강제라 start 4회($0.16). **32배 차이**가 여기서 난다.
    #   · 아이템 단가는 같은 $0.005인데 **중복률이 낮다**(1.56배 vs burbn 2.33배)
    #     → 같은 돈으로 고유 글을 더 많이 준다.
    #   · 실측: '출시했습니다' 25건 · 한글 24 · 전 필드 파싱 100% · 청구 $0.130(=start 0.005 + 25×0.005)
    #   ※ 한국어 검색이 되는 액터는 burbn과 이것뿐이다. 배치 입력을 받는 액터(futurizerush·
    #     automation-lab·meta)는 **전부 한국어 검색 0건**이었다(실측).
    # 21런(키워드 21개) × 런당 추정 $0.235 → 캡 $0.30. 천장의 절반이 여기서 나온다(21×0.30=$6.30).
    "igview-owner~threads-search-scraper":
      {memory_mb: 1024, start_usd: 0.005, price_per_item: 0.005, max_charge_usd: 0.30}
    # min=512 max=1024 → 1GB. 기본값 4096은 이 액터의 **최대치를 넘는다**. 1런 × 추정 $0.60 → 캡 $0.78
    "futurizerush~threads-replies-scraper":
      {memory_mb: 1024, start_usd: 0.005, price_per_item: 0.0025, max_charge_usd: 0.78}
    # start 미과금(search-page $0.10 + profile $0.004로 과금). 이미 256MB로 돌고 있었다.
    # search-page $0.10 은 **런당** 과금이다(1런=1페이지≈25명). start_usd 로 모델링하지 않으면
    # 추정이 50% 낮게 나온다(실제 $0.20/페이지를 $0.10으로 봤다).
    # 12런(축 12개 × pages 1) × 런당 추정 $0.20 → 캡 $0.26
    "harvestapi~linkedin-profile-search":
      {memory_mb: 256, start_usd: 0.10, price_per_item: 0.004, max_charge_usd: 0.26}
    # ↓ 아래 둘은 post_search 엔진 전용 = **현재 engines에서 꺼져 있어 안 돈다.**
    #   그래도 캡을 박아둔다 — 캡 없는 액터가 코드에 살아 있으면, 엔진을 켜는 순간
    #   추정에도 안 잡히고 상한도 없이 돈다. estimate_cost.py가 이걸 기계로 막는다.
    # 🔴 [2026-07-20 실측] 이 캡($1.00)은 **현 설정의 1.0%다.** 켜면 99%가 조용히 잘린다.
    #   현 설정 실비: discovery 14쿼리×200글×5p = 14,000 + monitoring 500명×20글 = 10,000
    #                = 24,000아이템 × $0.004 = **$96.00** (월 예산 $45의 213%)
    #   → **캡을 올려서 해결하지 마라.** 올리면 예산을 2배로 뚫는다. 켜려면 범위를 먼저 줄여라
    #     (pages 5→1 · monitoring.batch 500→60 = 우선군+이탈임박 규모). 그 뒤 캡을 실비×1.3으로.
    #   지금은 `engines: [profile_search]`라 안 돈다. estimate_cost.py가 켜는 즉시 $96을 보고하고
    #   preflight 게이트($12)가 **수집 시작 전에 막는다** — 실측으로 확인함(2026-07-20).
    #   ⚠️ 이 액터는 start $0 + 아이템 100%라 profile-search(런당 $0.10 고정비)와 비용 구조가
    #     정반대다. 여기선 `max_posts`가 유일한 노브다(stage6 '런 수만이 노브' 3원칙 대상 아님).
    "harvestapi~linkedin-post-search":
      {memory_mb: 256, start_usd: 0.0, price_per_item: 0.004, max_charge_usd: 1.00}
    # 게시글 작성자 위치 조회(_author_locations). 100명 배치, $4/1k → 배치당 $0.40.
    "harvestapi~linkedin-profile-scraper":
      {memory_mb: 256, start_usd: 0.0, price_per_item: 0.004, max_charge_usd: 0.52}
    # ★★ [2026-07-13] **스레드 프로필(bio) 전용.** 이 액터가 `Author Headline`을 채운다.
    #   왜 필요한가: 글 한 편은 중앙값 **75자**라 "이 사람이 뭘 하는지" 알 수 없다. bio는 알려준다.
    #     「불당 22대로92 1층 더덕삼겹살 전문점!」  ← 한 줄로 쓰레기 판별
    #     「🚀 Founder & CEO of ONE」              ← 한 줄로 진성 판별
    #   ⚠️ **키워드 액터(igview)는 bio를 안 준다.** meta만 준다 → 그래서 별도 enrich가 필요하다.
    #   실측: usernames 배열(상한 없음) · 한국어 ✅ · 5명/28초 · **$0.025 = 정확히 5×$0.005**
    #        (start 수수료 0). biography·follower_count·is_verified·latestPosts 반환.
    # 캡 = 런당 추정 × 1.3. backfill_bio.py 는 50명씩 배치를 돌지만, estimate_cost 는 이 층을
    # 1런(=FG 신규 120명)으로 모델링한다 → 120 × $0.005 = $0.60 → 캡 $0.78.
    # ⚠️ 백필 대상이 늘면(첫 실행처럼 600명) 캡이 부족해 잘린다 — 그때 이 값을 올려라.
    "apify~threads-profile-api-scraper":
      {memory_mb: 1024, start_usd: 0.0, price_per_item: 0.005, max_charge_usd: 0.78}

channels:
  appstore:
    enabled: true
    # [정책 2026-07-11 사용자 결정] 앱스토어는 **판단 없는 신규진입 보드**다.
    # "발굴 가치가 큰지는 생각할 필요 없다. 2주 내 새로 들어온 앱 나열 + 정보 표시가 끝."
    # → AI 판별·한국팀 추정 없음. 6개월 컷 + 신규진입만으로 거르고 사람이 노션에서 본다.
    # 비용 $0 — 애플 무료·무인증 엔드포인트라 폭을 넓혀도 과금이 없다.
    charts: [top-free, top-paid, top-grossing, new]   # 무료·유료(SSR 200) / 매출·최신출시(RSS)
    top_n: 200                           # SSR 천장 200위
    # 25개 카테고리 전체. 36(전체)은 세부 장르의 상위집합이라 제외 — 대기업 재진입만 늘어난다.
    # ('new' 차트는 카테고리 구분이 없어 이 목록과 무관하게 전체 피드 1회만 부른다)
    genres: [6014, 6016, 6008, 6007, 6017, 6005, 6015, 6023, 6024, 6012,
             6013, 6000, 6002, 6011, 6009, 6003, 6018, 6004, 6006, 6010,
             6001, 6020, 6021, 6026, 6027]
    # 🔴 [2026-07-14] **true → false.** 이 한 줄이 젊은 앱의 **61%를 삼키고 있었다.**
    #   실측(무료차트 25카테고리 4,971앱): 출시 6개월 이내 522개 중
    #     · 이미 노션에 있음        174개
    #     · '신규진입'으로 잡힘      65개
    #     · 🔴 **사각지대 319개** ← 6개월 이내 + 노션에 없음 + 신규진입도 아님
    #   차트에 계속 있어서 스냅샷상 '이미 본 앱'인데 노션엔 **한 번도** 안 올라갔다.
    #   그리고 그게 정확히 우리가 찾는 사람들이다(개발사명이 사람 이름 — HEERIM HONG,
    #   woobyeong jeong, Jinho Cheon…). 우리가 **늦게 관측을 시작했다는 사실** 때문에
    #   진짜 앱이 영구히 지워지고 있었다.
    #
    #   ✅ 조건 ①(신규진입)은 **없어도 된다.** 중복은 노션 `app:{app_id}` 대조가 막고
    #      (07-14에 그 키를 고쳤다 — 그전엔 app: 키가 0개였다), 6개월이 지나면 자연히 빠진다.
    #      ①은 중복을 막는 게 아니라 **관측 시작 이전의 앱을 지우는** 역할만 했다.
    #   ✅ 최신출시(new) 피드가 0건이던 것도 **같은 원인**이다 — 첫 실행이 110개를 통째로
    #      '기준선'으로 삼켜버렸다. 이 줄 하나로 둘 다 해결된다.
    #
    #   ⚠️ 대신 **출시일 미상은 컷한다**(어댑터가 처리). 차트 전체를 훑는 모드에서 lookup이
    #      실패하면 나이를 모르는 앱 수천 개가 '미상 통과'로 노션에 쏟아지기 때문이다.
    #      (신규진입만 볼 땐 입력 자체가 강한 신호라 미상 통과가 안전했다 — 이제 아니다.)
    #   ⚠️ 스냅샷은 계속 저장한다 — 보드의 Δ·'진짜 신규' 배지가 그걸 쓴다.
    new_entry_only: false                # false = 차트 전체를 훑고 6개월 컷 + app_id 중복제거로만 거른다
    baseline_bridge: ["appstore_board"]  # appstore-rank 스킬이 쌓은 보드 스냅샷을 baseline 재사용
    enrich: true                         # lookup 보강(최초 출시일·평점·리뷰수·seller_url)
  threads:
    enabled: true
    # ★ [정책 2026-07-11] **매일 실행**. max_posts=40 캡이 실측상 하루치에서 이미 찬다
    #   (만들었습니다 52건/0일 · 출시했습니다 51건/1일). 주 1회 실행은 사실상 일간 스냅샷이었고
    #   "주당 진성 창업자 6명"은 실은 "하루치에서 6명"이었다. 매일 돌려 DB에 누적한다.
    #   → 주간 비용은 max_posts를 300으로 올리는 것보다 **싸다**(아이템당 과금이라 저볼륨
    #     키워드가 캡을 안 채우는 만큼 절약). 추정: 주 ~770아이템.
    #
    # ★ layers — **워치리스트 층 신설**(2026-07-11).
    #   팔로잉그래프 층은 액터가 sessionId(로그인 쿠키)를 요구해 원천 봉쇄됐다. 그런데 burbn에
    #   **`from` 파라미터(특정 사용자의 글만)**가 있다 — "우리가 찾은 빌더를 직접 등록해서
    #   그 사람의 새 글을 계속 본다"는 **로그인 없이 된다.** 이게 팔로잉그래프의 대체재다.
    #   키워드를 안 써도 잡히므로 "말한 사람만 잡힌다"는 천장을 부분적으로 뚫는다.
    #
    # ★ [2026-07-12 재설계] **3층 발굴 복원.** 요구사항의 핵심은 "단어를 안 써도 잡히는 층"인데
    #   그동안 keyword 층 하나만 살아 있었다. watchlist는 대체재가 **아니다** — 진입 조건이
    #   "키워드 층에 이미 잡힘"이라 `watchlist ⊆ keyword`이고, 뚫으라던 recall 천장을 그대로 물려받는다.
    #   · following_graph — "sessionId 때문에 원천 봉쇄"는 **거짓이었다.** 팀이 고른 액터 하나만
    #     로그인을 요구했고, 무로그인 액터(igview-owner, REQUIRED=['username'])가 실재한다.
    #   · replies — 액터는 무로그인이고 실재한다. payload 형식(객체 배열)이 틀려서 안 돌았을 뿐이다.
    # 🔴 [2026-07-20 stage11] **watchlist 폐기.** 같은 인구(Tier=Catch·타깃 로스터)를 보는데
    #   recheck+latestPosts가 완전 우위였다: 단가 $0.005 vs $0.026(**5.2배**) · 편수 4~16 vs 10 ·
    #   게다가 bio diff가 같은 호출에 딸려 온다. 측정 빌더도 0/6이었다.
    #   폐기 전 **편입 확인 필수였다** — 로스터에만 있고 recheck가 안 보던 9명을
    #   `recheck.always_include`로 편입한 뒤(고아 0명 확인) 뺐다. 안 했으면 9명이 조용히 사라졌다.
    #   롤백: 아래 목록에 watchlist를 되넣고 layer_cadence에 한 줄 추가하면 끝(코드 변경 불필요).
    layers: [keyword, following_graph, replies]

    # ★ [2026-07-20 결정 11] **층별 주기.** `layers`는 on/off, 여기는 "얼마나 자주".
    #   어휘는 링크드인 축과 공유한다 — core/cadence.py 가 정본이다
    #   (always/daily/weekly/biweekly/monthly/quarterly). **표에 없는 이름을 쓰면 크게 경고하고
    #   weekly로 처리한다** — 조용히 강등되지 않게 일부러 시끄럽게 만들었다.
    #   선언 안 한 층은 `always`(= 현행 유지)다.
    #
    #   근거(결정 1 검증): 절감은 "몇 건을 사느냐"가 아니라 **"얼마나 자주 사느냐"**에서 나온다.
    #     · keyword/replies = **실시간 플로우층.** 놓친 글은 영영 못 산다 → always 사수.
    #       (replies는 $당 최고 효율: 빌더11·타깃5 / $0.36, 발견 인물 전원 1일 이내 신호)
    #     · following_graph = **고갈형 스톡층.** 수확의 76%가 시드 1개, 잔여 빌더 ~45명.
    #       격주는 손실이 아니라 **이연**이다 → −$3.4/월, 확정 손실 0.
    #     · watchlist = R1 스모크까지 현행 유지. `latestPosts`(bio 액터가 이미 주는데 버리는 중)가
    #       같은 일을 1/5 가격($0.005 vs $0.026)에 할 수 있어, **주기가 아니라 레인 존폐가 먼저**다.
    layer_cadence:
      keyword: always
      replies: always
      following_graph: biweekly          # 💰 결정 11
      # watchlist: 폐기됨(stage11) — 되살리려면 layers에 다시 넣고 이 줄의 주석을 풀어라
    watchlist_posts_per_account: 10      # 감시 계정당 최근 글 수
    # 자동 등록 트리거 — **위조 불가 어휘.** 실제로 앱을 내보지 않으면 쓸 수 없는 말들이다.
    # 뉴스 계정·쇼핑몰·강의팔이는 이런 말을 못 쓴다 → 이 말을 쓴 사람은 거의 확실히 진짜 빌더다.
    # (착지한 사람을 전부 넣으면 명단이 노이즈로 차서 감시가 무의미해진다)
    # 🔴 [2026-07-13 실측] "피드백"이 여기 들어와 있었다. 그 한 단어가 **31명을 등록**시켰고
    #   (네일샵·인테리어·소주계정·시청), 진짜 위조 불가 어휘 5개는 **다 합쳐서 1명**이었다.
    #   워치리스트 103명 중 97%가 가짜였던 진범이다. 이 목록에 **흔한 말을 넣지 마라** —
    #   넣는 순간 "이 말을 쓴 사람은 빌더다"라는 이 층의 유일한 근거가 사라진다.
    #   판정도 쿼리가 아니라 **글 본문 대조**로 한다(adapters/threads.py::_harvest_watchlist).
    watchlist_triggers: ["앱스토어 심사", "비공개 테스터", "테스트플라이트", "심사 리젝",
                         "유저 인터뷰"]
    mode: "apify"                        # keyword 층 소스: official(Graph API) | apify
    # 🔴 [비용 가드 2026-07-12 — 사용자 결정 '타이트'] 이 두 줄이 계정을 태웠다.
    #   실측: 07-10 burbn run 6건 = **$5.94**. FREE 한도가 $5다 → 스레드 keyword 층 **단독으로**
    #   월 한도를 초과시켰고, 그때부터 스레드·링크드인이 전부 403으로 죽었다.
    #   그런데 config는 그 뒤 max_posts를 40→300, 키워드를 6→19개로 올려놨다:
    #     19쿼리 × (300아이템 × $0.02 + $0.04) = **이론 $114.76/일 ≈ $3,400/월**
    #   게다가 `after = today - max_post_age_days`라 **매일 최근 N일치를 다시 긁는다** —
    #   Apify는 반환 아이템당 과금이고 URL 중복 제거는 **과금 이후** 클라이언트에서 일어난다.
    #   14일이면 같은 글 하나에 **최대 14번 과금**하고 착지는 1건이다.
    max_posts: 40                        # 300 → 40. 코드 주석(threads.py:83-89)의 원래 설계 근거로 복귀:
                                         # "40 캡은 실측상 하루치에서 이미 찬다. 매일 돌면 같은 캡으로 7일을 덮는다."
    max_post_age_days: 2                 # 14 → 2. **재과금 제거가 목적이다.** 매일 도는 채널이므로
                                         # 2일치면 하루 결번(크론 실패)까지 덮는다. 같은 글 최대 2회 과금.
                                         # (낡은 글을 넓게 긁는 건 '발굴'이 아니라 같은 글을 다시 사는 것이다)
    # ★ 다운타임 백필 — 창을 2일로 좁히면 **채널이 멈춰 있던 구간이 영구 유실된다.**
    #   (지금이 정확히 그 상황: 07-11부터 403으로 정지. 결제가 5일 뒤면 그 5일치는 다시는 안 온다.)
    #   → 마지막 성공 수집일까지 되짚어 긁는다. 상한을 두는 이유: 한 달 멈춘 뒤 재개하면
    #     한 달치를 한 번에 사서 또 한도를 태운다.
    backfill_cap_days: 14                # 백필 최대 소급 일수
    drop_replies: false                  # ⚠️ true였던 걸 되돌림. 리플 38건에서 진성 창업자
                                         # @jakecoldbyte가 나왔다. "리플 전용 작성자 12명이 노이즈"라는
                                         # 이유로 통째 버리면 그 1명이 영구 소실된다.
                                         # **수집에서 자르지 말고 judge가 판단하게 한다.**
    # 액터 slug — Apify 스토어 실존 검증 완료.
    # 💰 keyword 액터 = **비용의 93.6%**($5.94/$6.35). 여기가 유일한 비용 레버다.
    #    burbn      $0.024/item (FREE 티어 실측) — 현행 백본, 6,457 runs
    #    futurizerush~meta-threads-scraper  $0.0025/item · 77,240 runs · search 모드 지원
    #      → **8~10배 싸다.** 단 출력 스키마가 다르므로(_post_to_candidate의 필드 폴백 확인 필요)
    #        결제 후 1회 프로브로 검증한 다음 스왑한다. 눈감고 바꾸면 스레드 채널이 전면 0건이 된다.
    actors:
      # burbn → igview-owner. 출력 스키마 동일(파서 변경 0), start 32배 저렴(4GB강제 vs 1GB가능).
      # burbn은 롤백용으로 config.apify.actors 에 남겨둔다.
      keyword: "igview-owner~threads-search-scraper"
      # ★ 2026-07-12 스왑 — 라이브 스키마 GET으로 **로그인 불필요 확정**:
      #   required=['username'] · props={username, max_following}. sessionId 없음.
      #   기존 futurizerush~…-api 는 sessionId를 요구했다 → 그것 하나 보고 "원천 봉쇄"로 접었던 것.
      following: "igview-owner~threads-user-following-scraper"     # 무로그인 (291 runs)
      # ★ [스모크 2026-07-13] burbn의 `from`은 **쓸 수 없다.**
      #   실측 400: "Field input.searchQuery must NOT have fewer than 1 characters"
      #   → burbn은 "그 사람의 모든 글"을 못 준다(검색어가 반드시 필요). 워치리스트·팔로잉 글 층이
      #     구조적으로 불가능했던 것. meta-threads의 `mode:user`가 이걸 정확히 한다.
      #   실측: 한국 계정 2명 → 글 14건, **런 1회 $0.02** (usernames 배열).
      #   ⚠️ meta의 `mode:search`는 한국어를 못 한다(실측 0건) → **keyword 층은 burbn 유지.**
      user_posts: "futurizerush~meta-threads-scraper"
      replies: "futurizerush~threads-replies-scraper"              # 무로그인. required=['post_urls'(객체배열)]
    # 🔴 [2026-07-13] 12는 **burbn 시절 화석**이었다(계정당 런 1회 $0.16 → 캡이 곧 돈).
    #   지금 meta는 **20명을 한 런에** $0.27로 처리한다 → 캡을 올리는 비용이 사실상 없다.
    #   ⚠️ 캡 < 명단이면 **로테이션이 돌고, 로테이션은 글을 잃는다.**
    #     한 사람을 (명단÷캡)회에 한 번 보는데 액터는 최근 watchlist_posts_per_account(=10)편만 준다.
    #     그 사이 10편 넘게 쓰면 넘친 만큼 **영영 못 본다**(이 층엔 날짜 컷이 없어 백필도 못 줍는다).
    #     수동 실행이면 '한 바퀴'가 몇 주다 → 손실이 커진다.
    #   → **명단 전체를 덮어라.** 20의 배수로 잡으면 런이 딱 떨어진다. 어기면 어댑터가 🔴로 찍는다.
    #     현재 명단 = 큐레이션 10 + 자동 1 = 11명.
    watchlist_max_accounts: 20           # meta 배치 1런 = 20명. 명단이 20을 넘으면 40으로(2런, +$0.27).
    # ★ [2026-07-17 팔로업] 워치리스트 명단 조립 — 순서가 곧 우선순위(캡 로테이션에서 앞이 생존).
    #   notion = Tier=Catch(judge) 또는 타깃 ✅(사람)인 스레드 인물. 이 층의 용도 재정의:
    #   "발굴"(트리거 자동등록, 실측 빌더 0/6)이 아니라 **"만나고 싶은 소수의 추적"**.
    #   롤백 = sources에서 notion 제거 한 줄 (구동작 = curated+auto).
    watchlist_roster:
      sources: [curated, notion, auto]
      notion_tiers: ["Catch"]
      notion_target_checkbox: true       # 타깃 ✅ 행 포함
    # ── 발굴 ② 팔로잉그래프 — **정밀도 1위 층이다** (19.1% vs 키워드 11.5%) ──
    #   빌더 21명을 데려왔고 그중 **키워드가 잡은 사람은 0명**이다. 전체 빌더의 35%.
    #   시드 설계·킬룰은 keywords.yaml 의 following_seed_accounts 주석 참조.
    following_max_per_account: 30        # 액터 상한. 이건 천장이 아니라 **랜덤 표본**이다
                                         # (같은 시드 재실행 시 겹침 4/30 → 반복하면 새 사람이 온다)
    # 🔴 [2026-07-14] 60 → 120. 07-13 로그: "확장 108계정 · 처음 보는 계정 108명"인데
    #   `novel[:60]`이 잘라서 **돈 주고 산 48명을 버렸다.** 착지는 person stub이라 **$0**다.
    #   48명 × 19.1% = **빌더 9명을 공짜로 잃고 있었다.** 이번 개선의 최대 항목이고 비용은 0이다.
    following_max_expanded: 120          # 착지시킬 순증 인원 상한 (글 없어도 착지 — $0)
    following_posts_per_user: 5          # (글 구매를 켤 때만 의미)
    # 🔴 [2026-07-14] **FG 글 구매 폐지 (15 → 0).** 이유 셋:
    #   ① 코퍼스 FG 120명 중 **100명이 글이 아예 없다.** 글을 안 쓰는 사람들이라 사도 빈손이다.
    #   ② 07-13 실행에서 meta 액터가 이 층에 대해 **400 FAILED**로 실패했다.
    #   ③ **bio가 이 층의 유일한 신호다** — 빌더 라벨 513개가 전부 bio에서 나왔는데
    #      팔로잉 액터는 bio를 **안 준다**. 단가도 bio $0.005 < 글 $0.0135로 **2.7배 싸다**.
    #   → 글 대신 **bio를 산다**: land 후 `tools/backfill_bio.py`(멱등). 120명 × $0.005 = $0.60.
    following_posts_budget: 0            # 0 = FG 글 구매 안 함
    # ── 발굴 ③ 리플라이 크롤 (앵커 포스트 댓글) ──
    replies_max_per_anchor: 30           # 실측 앵커당 댓글 ~8~9개. 50은 추정만 부풀린다(액터 상한 50)
    replies_max_anchors: 8               # 현재 앵커 풀이 5개다. 20은 추정만 부풀린다(액터 상한 20)
    # 앵커 자동 수확 — 앵커 URL을 사람이 매번 찾아 넣는 건 지속가능하지 않다.
    # keyword 층이 가져온 글 중 **댓글이 많이 달린 글**을 다음 실행의 앵커로 자동 등록한다
    # ("요즘 뭐 만드세요?" 류 글은 정의상 댓글이 많다). data/threads_anchors.json에 누적.
    anchor_min_replies: 8                # 이 이상 댓글 달린 글을 앵커 후보로
    anchor_keep: 30                      # 앵커 풀 상한(최신순)
  linkedin:
    enabled: true
    # [엔진 전환 진행중] kv-linkedin(키워드+Claude판단) 방식으로 이행 예정 — sourcing_linkedin.py
    # 등 파일 인계 후 mode를 kv_script로. 그 전까지 harvestapi 2엔진이 기본(밴리스크 0).
    mode: "harvestapi"                   # harvestapi(현행) | kv_script(내일 파일 인계 후)
    # post_search 제거 — **구조적 부적합.** 라이브 스키마 24개 파라미터에 location/geo/country가
    # 전무하다(profile_search엔 locations 있음). post_search에서 한국을 겨냥할 유일한 수단은
    # 쿼리를 한국어로 쓰는 것인데, 그건 지역 필터가 아니라 **언어 필터**다 — 이미 기각된
    # "한글비율 컷"과 같은 축이고, 야심 있는 한국 창업자일수록 창업 공지를 영어로 쓴다.
    # (실측: 한국어 7쿼리 전부 0건 반환. 액터는 SUCCEEDED, 에러 0.)
    # 🔴 [2026-07-13] post_search를 **끈다.** 주석은 "제거"라 써 있는데 목록엔 남아 있었다.
    #   실측 단가: 글당 $0.002 + 작성자 프로필당 $0.002.
    #   현 설정이면 discovery(14쿼리 × 200글 × 5페이지) + monitoring(500명 × 20글)
    #   = 최대 24,000아이템 ≈ **$48/런**. 이것 하나가 $10 천장을 혼자 날린다.
    #   07-11에 $0.007로 끝난 건 한국어 쿼리 7개가 전부 0건이어서였다 — 그 뒤 영어 쿼리 8개가
    #   추가됐으므로 결제하는 순간 터진다. 발굴 폭을 넓히려면 monitoring부터 끄고 discovery만
    #   좁게(pages 1 · max_posts 50) 다시 켠다.
    engines: [profile_search]
    profile_search:                      # people-search = 발굴 본체
      # ★ Full 모드 (사용자 결정) — **학력(education)이 필요하다.**
      #   Short는 education을 아예 안 준다(0/97 실측). 그래서 `kr-tie-global` 축(한국 학교로 거는
      #   해외 거주 한국인 창업자 축)이 제대로 작동했는지 **검증할 방법이 없었다.**
      #   Full은 per-profile 과금이 붙지만 비용은 신경 쓰지 않기로 했다.
      #   ⚠️ Full이 vanity URL(publicIdentifier)도 주는지 확인할 것 — Short는 0/97이라
      #      프로필 URL이 /in/ACwAAAf_U54B... 형식이고 사람이 못 읽는다.
      scraper_mode: "Full"               # Short | Full | "Full + email search"
      pages: 10                          # 기본값 (keywords.yaml이 축별로 덮음)
      # takePages를 액터가 **무시하는 것이 확정 사실**이다(4런 전부 takePages=2 → pageNumber {1}만 반환).
      # 5로 두면 첫 유료 런이 5페이지를 요청해 1페이지만 받고 강등 로직을 타며 헛돈을 쓴다. → 1로 고정.
      batch_pages: 1                     # 액터가 takePages를 무시함 — 페이지당 1런이 실측상 유일하게 작동
      max_items: 2500                    # 쿼리당 절대 천장(startPage 100 × 25)
      # 리크루터/헤드헌터를 검색 단계에서 제외한다. 이들 다수가 자기 리크루팅 회사의 "대표·Founder"라
      # `직함:Founder, 한국` 검색에 대량으로 섞인다. **2,500 천장이 있어서 이들이 자리를 먹으면
      # 진짜 창업자가 그만큼 밀려난다.** (유일한 하드컷 — 뺄지는 사용자 결정)
      exclude_titles: [recruiter, "talent acquisition", headhunter, sourcer, "HR manager"]
      kr_schools: [                      # 해외 한국인 창업자 포획 (Full 모드라야 검증 가능)
        "Seoul National University", "KAIST",
        "Korea Advanced Institute of Science and Technology",
        "POSTECH", "Yonsei University", "Korea University"]
      seen_store: "data/linkedin_seen.json"
      recheck_days: 90                   # ★ 3개월(사용자 결정). 한 번 본 사람도 90일 뒤 다시 본다.
      compare_within_window: true        # ★ [2026-07-17 팔로업] 90일 창 **안**의 재조우도 지문(회사|직함)을
                                         #   비교해 변화면 즉시 재검토로 올린다. 아이템은 seen 체크 전에 이미
                                         #   산 것이라 비용 0. 롤백 = false 한 줄(구동작: 창 내 무조건 스킵).

                                         #   Stealth → 회사명 공개처럼 **프로필이 바뀌는 순간**이
                                         #   가장 이른 신호인데, 영구 제외하면 그걸 영영 놓친다.

    # 🔴 [2026-07-21 결정 14] **post_search를 접는다(기각 유지).** 정본 스위치는 위 `engines`이고
    #   거기 post_search가 없어 이미 안 돈다 — 아래 두 하위 스위치도 false로 **명시적으로 못박아**,
    #   다음 세션이 "이거 켜야 하나" 하고 다시 집어들지 않게 한다.
    #
    #   두 부분 다 명분이 없다:
    #   · discovery(모르는 사람 발굴): 2026-07-13에 이미 기각 — 라이브 스키마에 location/geo/country가
    #     전무해 한국을 겨냥할 수단이 없다. "작성자 프로필이 딸려 오니 받아서 거르면 된다"던 부활
    #     근거는 **비용을 안 따질 때만** 성립했는데, 지금은 월 예산 $45 하드캡이 있다(실비 $96).
    #   · monitoring(아는 사람 새 글 감시): **리텐션 레인이 이미 대체한다.** recheck-linkedin
    #     ($0.004/인, 2026-07-21 유료 검증)이 "아는 링크드인 사람의 새 신호 감지"를 훨씬 싸게 한다.
    #     monitoring은 500명×20글 아이템 과금 + 지역 조회 별도 — 완전 열위.
    #     🔴 게다가 monitoring.watch_axes(recent-job-kr·t-stealth·t-recently-posted)는 07-14
    #        재설계 이후 **현재 5축과 교집합 0**이라, 켜도 신규등록 영구 0건인 죽은 코드였다.
    #
    #   되살리려면: engines에 post_search를 넣고 아래 enabled를 켜기 **전에**, 먼저 (a) 지역
    #   타게팅 수단과 (b) watch_axes를 현재 축으로 갱신하고 (c) L4(max_posts) 실측을 해야 한다.
    #   그 전엔 preflight 게이트($12)가 실비 $96을 보고 수집 시작 전에 막는다(정상 동작).
    post_search:
      discovery:
        enabled: false                   # 기각(지역 필터 부재) — 위 결정 14 참조
        posted_limit: "week"             # any|1h|24h|week|month|3months|6months|year
        max_posts: 200                   # 쿼리당
        pages: 5
      monitoring:
        enabled: false                   # 기각(리텐션 레인이 대체 + watch_axes 죽음) — 결정 14 참조
        # ★ 감시 대상을 **고밀도 축에서 나온 사람으로 한정**한다(사용자 결정).
        #   워치리스트에 2,000명을 다 넣고 100명씩 돌리면 **한 바퀴에 20주**가 걸린다 —
        #   "지금 움직인다"를 20주 만에 아는 건 실시간 신호가 아니다.
        #   t-founder(재직 중앙값 6.2년 = 명성 자석)에서 나온 사람을 감시해봐야 소득이 없다.
        #   극초기 축에서 나온 사람만 감시하면 **매주 전원을 커버**할 수 있다.
        watch_axes: [recent-job-kr, t-stealth, t-recently-posted]
        batch: 500                       # 한 실행에 볼 사람 수 (그래도 넘치면 커서로 로테이션)
        posted_limit: "week"
        max_posts: 20                    # 1인당
  linkedin_listly:                       # 링크드인 보조 어댑터(반자동 xlsx/csv 드롭)
    enabled: false                       # 🔴 OFF — 드롭 폴더가 비어 있어 매 실행 no-op였다.
                                         # 사람이 Listly로 export한 파일을 넣는 반자동 경로인데,
                                         # harvestapi 축이 10개로 늘어난 지금은 필요가 없다.
    drop_dir: "data/linkedin_listly"     # 사람이 Listly로 export한 xlsx/csv를 여기 두면 수집이 읽음
    # 거주지 2버킷(A.대한민국 / B.미국+타깃스쿨)은 사람이 링크드인에서 검색 시 거는 필터.
    # 파일명에 kr/us를 넣으면 signals.bucket으로 자동 태깅.
  naver:
    enabled: false                       # [3채널 모드 2026-07-10] 부가채널 off (착지 대상 아님)
    endpoints: [blog, cafearticle]       # NAVER_CLIENT_ID/SECRET 필요
    display: 100
  disquiet:
    enabled: false                       # [3채널 모드] off
    max_pages: 5
    new_entry_lookback_days: 7           # 스냅샷 신규 slug 비교 간격
  velog:
    enabled: false                       # [3채널 모드] off
    tags: [사이드프로젝트, 창업, 개발]
    recent_days: 30                      # searchPosts 결과 recency 필터
    limit: 50
  x:
    enabled: false                       # [3채널 모드] off (유료 액터 — 착지 대상 아님)
    lang: ko
    max_items: 300
  hackernews:
    enabled: false                       # 글로벌 캐치, 기본 off
    lookback_days: 7
  producthunt:
    enabled: false                       # 글로벌 캐치, 기본 off (PRODUCTHUNT_TOKEN)
    lookback_days: 7
    first: 50

judge:
  # [방침 2026-07-11] 최대한 많이 수집하고, **의미 없는 홍보성 글만** 걷어낸다.
  # AI 판단(L1/L2)은 보류 — judge.py의 _ai_judge는 패스스루. 정예 선별은 사람이 노션에서.
  longlist_target: 15                    # [A10] (AI 판단 도입 시) 주간 롱리스트 목표
  surface_threshold: 0.5                 # [A8] (AI 판단 도입 시) surface/borderline 경계
  include_borderline_in_sync: false      # [D2]

  # ── LLM 사실분류 (규칙 위에 얹는 2단) ──
  # "좋은 팀인가"는 판단하지 않는다. "홍보글인가"(스레드) · "대기업인가"(앱스토어)라는
  # **정답이 있는 사실 질문**만 던진다. 정규식이 원리적으로 못 하는 영역을 메운다.
  # ANTHROPIC_API_KEY가 없으면 조용히 규칙만으로 동작한다(파이프라인 안 죽음).
  llm:
    # 🔴 [2026-07-13] **끈다.** 판단은 반자동(주 1회 Claude Code 세션 → judge-export/judge-apply)이
    #   대체한다(사용자 결정). true로 두면 누가 .env에 ANTHROPIC_API_KEY를 넣는 순간
    #   **상한 없는 LLM 패스가 조용히 되살아난다** — 크론이 매일 도는데 아무도 모른다.
    #   (지금까지 안 돌던 이유도 "끔"이 아니라 "키가 없어서"였다. 그건 가드가 아니다.)
    enabled: false
    model: "claude-opus-4-8"             # 비용 더 줄이려면 claude-haiku-4-5 (품질 트레이드오프는 본인 판단)
    # 실측 추정: 스레드 ~$0.3/회 · 앱스토어 첫 회 ~$0.35(424개 개발사) → 캐시 후 ~$0.01.
    # 개발사 판정은 data/dev_registry.json에 영구 캐시 — 같은 개발사를 다시 묻지 않는다.

  # ── 스레드 규칙 컷 (실측 튜닝: 99명 중 11컷, 진성 창업자 오탐 0) ──
  threads:
    promo_cut: true                      # false로 두면 규칙 컷 없이 전량 LLM/사람에게 넘어감

  # ── 앱스토어 L0 (결정론적, AI 없음). 여기서 "발굴 가치"는 판단하지 않는다 ──
  appstore:
    max_age_days: 180                    # **6개월** — 최초 출시일이 이보다 오래면 컷 (미상이면 통과)
                                         # 사실상 유일한 필터. 2년 기준일 때 461컷 중 459를 이 룰이 했다.
                                         # 6개월로 좁히면 기아 앱(2024-09)·나라사랑포털(2026-01)도 자동 제거.
    # [A1] 개발사명에 아래 토큰이 (부분·대소문자무시) 들어가면 대기업/기관으로 보고 컷.
    #      substring 매칭이라 짧고 흔한 토큰은 오탐 위험 → 실런 로그 보며 조정.
    bigcorp_denylist:
      # 금융/기관
      - 은행
      - bank
      - 카드
      - 증권
      - 보험
      - 캐피탈
      # 통신/대형 플랫폼
      - 네이버
      - naver
      - 카카오
      - kakao
      - 쿠팡
      - coupang
      - 우아한형제들      # 배달의민족
      - 비바리퍼블리카    # 토스
      - toss
      - 당근
      - karrot
      - 무신사
      - musinsa
      # 대기업 그룹
      - samsung
      - 삼성
      - hyundai
      - 현대
      - 롯데
      - lotte
      - posco
      - 한화
      - 신세계
      - "cj "
      # 게임 대형사(게임 장르 제외했어도 유틸로 새는 경우)
      - nexon
      - 넥슨
      - ncsoft
      - 넷마블
      - netmarble
      - krafton
      # 공공/교육
      - 대학교
      - university
      - 시청
      - 공사
      - 공단
      - 진흥원
      - 재단
      - 협회
      # [2026-07-11 추가] 2년 컷을 **실제로 통과한** 대기업/기관만 정밀 추가.
      # 대부분의 대기업 앱(홈플러스 2011·배민 2010·라인 2011·티맵 2011)은 2년 컷이 이미 잡는다.
      # ⚠️ 짧은 토큰은 substring 오탐 위험 → 완전명으로 적을 것.
      #    "kia" 단독은 Nokia에 걸리고, "toss"는 Toss Lab(잔디)을, "bank"는 Banksalad를 죽인다.
      - kia corporation                  # Kia App (2024-09 출시 — 2년 컷 통과함)
      - 공제회                            # 나라사랑포털 = 군인공제회 (2026-01)
      - mutual aid association
      - kukkiwon                         # 국기원 — denylist에 없어 통과했었음
      - 국기원

schedule:
  # ★ [정책 2026-07-11] **매일 실행**으로 전환. 주 1회로는 두 채널이 구조적으로 유실된다:
  #   · 스레드   max_posts=40 캡이 하루치에서 이미 찬다 → 주 1회 = 사실상 일간 스냅샷
  #   · 앱스토어 RSS 최신출시가 110건 하드캡에 하루 ~35건씩 회전 → 주 1회면 60% 유실
  # 수요일 미팅용 다이제스트는 **DB에 누적된 것을 조회**해서 만든다(수집과 분리).
  cadence: "daily"
  hour: 8
  weekday: 2                             # (cadence=weekly일 때만) 화요일 = 미팅 하루 전
  notify: false                          # 실행 후 슬랙/메일 요약
