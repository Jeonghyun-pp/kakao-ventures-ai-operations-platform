[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-core"
version = "0.1.0"
description = "KV 인턴업무 자동화 공통 런타임 — secrets · notion · notify · paths · gate · job · health"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["kv_core*"]
