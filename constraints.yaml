# [0] 외부 제약 — 기계가 읽는 판
#
# 남의 시스템이 그렇게 생겨서 우리가 어쩔 수 없이 지키는 숫자들이다.
# **코드에 이 값을 리터럴로 박지 않는다.** 여기서 읽는다.
# 그래야 제약이 흩어지지 않고, 바뀔 때 한 줄만 고친다.
#
# 근거는 각 키의 주석이다(옛 kv-automation/docs 의 실측 문서는 2026-09-26 정리 때 지웠다 — 남은 기록은 여기와 각 통로의 docstring).

appstore:
  # 🔴 밖으로 나가는 문(kvlib.gate). 나가는 것은 노션 착지(land)와 격주 리마인드(remind, 슬랙 글). 살아 있는 시스템이라 on 에서 시작 — off 는 시험·중단용
  outbound: "on"
  report_channel: "test"       # 하루 보고 요약 · health → review_test. 심사역은 노션 뷰를 본다(9/22) — 슬랙 카드 없음
  # 🔴 격주 "앱스토어 보세요" [사용자 결정 2026-09-29 회의]. 노션 뷰는 아무도 안 열면 없는 것과 같다 — 2주마다 한 번 민다.
  #    기준일부터 N일 간격, 그날이 주말·공휴일이면 다음 평일(날짜가 밀려도 다음 회차는 기준일 간격 그대로).
  remind_channel: "net"        # #그물망
  remind_every_days: 14
  remind_anchor: "2026-10-05"  # 첫 회차(월). 10/5 는 개천절 대체라 첫 발송은 10/6(화)
  remind_view: "https://www.notion.so/0000000000000000000030deea8edcc5?v=000000000000000000002752bd2764ab"   # [주차] 유입 추이
  report_slack: "on"
  foreign_sample: 8            # 보고서에 보여줄 foreign 판정 표본 수 — 노션에 안 가는 앱을 사람이 5초씩 훑는 자리
  backup_keep: 7
  # 차트 천장. "200 요청했는데 100 왔다"를 결손으로 오판하지 않기 위해 안다.
  chart_caps:
    top-free: 200        # SSR
    top-paid: 200        # SSR
    top-grossing: 100    # RSS
    new: 110             # RSS. 하드캡이고 genre 를 무시한다

  # RSS newapplications 는 genre 파라미터를 무시한다 → 전체 1회만 부른다.
  # 어기면 25개 장르 × 같은 응답을 25번 받는다.
  rss_new_ignores_genre: true

  # 빈 배열이 정답인 차트. 카지노 유료는 한국 앱스토어에 원래 없다.
  # 어기면 "부분 결손" 경보가 매일 뜬다 (실제로 그랬다).
  empty_is_valid:
    - "7006/top-paid"

  # 신규진입은 diff 라 안 본 날은 영영 못 본다. 관측 40일 중 8일이 결손이었고 복구 불가.
  observation_gap_is_permanent: true

  # 출시일 미상 비율이 이걸 넘으면 lookup 장애를 의심한다. 평시 0% (실측 4,971/4,971).
  unknown_release_date_warn_ratio: 0.05

  # 🔴 [2026-08-17 실측 · 새 제약] 애플 SSR 차트 페이지는 연속 요청에 429 를 준다.
  #    간격 없이 76요청을 쏘면 39/76 이 429 로 죽었다. 개별로 다시 부르면 전부 200.
  #    옛 시스템은 "429 는 상대의 답이니 재시도 안 한다"로 404 와 같이 취급했는데,
  #    429 는 **"천천히 하라"는 재시도 신호**라 404 와 성격이 다르다.
  #    → 요청 사이에 간격을 두고, 429 는 Retry-After 를 존중해 재시도한다.
  request_gap_sec: 1.0

  # 신규 판정 기준. 이보다 오래된 앱은 버린다.
  max_age_days: 180

  # 국적 판정(kr_origin). 규칙을 고치면 반드시 eval 을 돌린다.
  kr_origin:
    hangul_foreign_max_ratio: 0.05   # L7: 한글 비율 이하면 foreign
    min_description_length: 40        # L7: 이보다 짧으면 비율 판정 안 함
    over_deletion_warn_ratio: 0.90    # HEALTH: 외국 비율 이 이상이면 경고

http:
  # 망 계열만 재시도한다. 404·429·5xx 는 상대 서버의 답이지 망 문제가 아니다.
  # RequestException 을 통째로 잡으면 MissingSchema 같은 프로그래밍 오류까지 105초 기다렸다
  # 재시도한다 — 고쳐야 할 것을 숨긴다.
  retry_backoff_sec: [15, 30, 60]     # 총 105초. 절전 해제 직후 DNS 미기동 대비 (07-18 착지 229건 유실)
  timeout_sec: 30
  # 429·5xx 는 망 계열과 **다른 정책**이다. 429 는 "천천히 하라"는 재시도 신호이고
  # (Retry-After 를 주면 그걸 따른다), 5xx 는 상대의 일시 장애다.
  # 404·400 같은 4xx 는 여전히 재시도하지 않는다 — 그건 상대의 확정된 답이다.
  retry_status: [429, 500, 502, 503, 504]
  status_backoff_sec: [2, 5, 15]
  # 회로 차단기: 한 번 끝까지 실패하면 나머지는 즉시 실패시킨다.
  # 없을 때 76요청 × 105초 = 2시간+ 크론이 잠겼다 (07-19).
  circuit_breaker: true

notion:
  rich_text_limit: 2000        # UTF-16 코드유닛. 파이썬 len 이 아니다.
                               # 이모지 3개로 2000자가 2003유닛 되어 495명 중 7명 착지 실패 (07-27)
  truncation_mark: "…⟪잘림⟫"    # 잘렸으면 잘렸다고 말한다. 값만으로는 구별이 안 된다.
  # 🔴 [2026-08-17 실측 · 새 제약] 노션은 유니코드 줄 구분자를 **조용히 제거한다.**
  #    앱 설명 864자를 보냈더니 862자가 저장됐다(U+2028 두 개가 사라짐).
  #    되읽기가 없었으면 영영 몰랐을 손실이다 — 옛 시스템엔 되읽기가 없었다.
  #    → 보내기 전에 개행으로 바꾼다. 그러면 저장된 값이 우리가 의도한 값과 같아진다.
  # 🔴 값 자체를 날것으로 쓰면 YAML 이 그 자리에서 줄바꿈으로 읽는다(실측 — 제약 파일이
  #    제약 문자 때문에 깨졌다). **이스케이프로 쓴다.**
  strips_chars: ["\u2028", "\u2029"]
  # 🔴 [2026-08-17 2차] U+0008(백스페이스)도 같은 일을 당했다 — 링크드인 about/headline 4건.
  #    하나씩 잡으면 계속 나온다. C0 제어문자를 **부류로** 막는다(\n·\t 는 남긴다).
  #    노션이 정확히 무엇을 지우는지는 문서에 없다. 되읽기가 새 문자를 만나면 또 잡을 것이고,
  #    그때마다 부류를 넓힌다.
  strips_control_chars: true
  # 🔴 [2026-09-16 실측 · 비플랜 첫 sync] 제로폭 문자도 지운다 — U+200B 하나 때문에 Example Company E 행이
  #    되읽기 불일치(610 vs 608)로 실패했다. 이건 개행이 아니라 **없애는** 게 맞다(폭이 0이다).
  strips_zero_width: ["\u200b", "\u200c", "\u200d", "\ufeff"]
  rate_limit_rps: 3            # 공식 한도. 성공해도 잔다.

claude:
  # 구독 세션에는 사용량 API 가 없다 → 호출 수를 프록시로 잰다.
  # 🔴 [사용자 결정 2026-09-21] 30/50 → 500/1000. 메일 관찰이 한 통에 한 번씩 부르고 상한 없이 돌리기로 했다.
  #    이 값은 쿼터 보호가 아니라 **폭주 감지**로만 남는다. 실제 구독 한도에 닿으면 claude 가 실패를 돌려주고
  #    호출부가 멈춘다(관찰은 그 실행을 중단하고 다음 날 잇는다).
  daily_calls_warn: 500
  daily_calls_block: 1000
  timeout_sec: 300             # 권한 프롬프트에 걸리면 무한정 멈춘다.
                               # 180 은 배치 하나를 못 끝내는 일이 잦았다 (08-30·31).
  forbidden_tools: [Bash, WebFetch, WebSearch]
  # run_skill(긴 세션·MCP) 의 상시 금지. 허용 목록(memo.allowed_tools)과 별개로 편집·삭제·git 은 어떤 스킬도 못 쓴다
  skill_forbidden_tools: ["Edit", "Write", "NotebookEdit", "Bash(rm *)", "Bash(git *)"]

apify:
  monthly_cap_usd: 29          # STARTER 실한도. 플랫폼이 정하고 우리가 못 넘긴다.
  fallback_memory_mb: 8192     # 메모리 폴백 시 비싼 쪽을 가정한다 (과소계상 방지).
  run_timeout_sec: 300         # 액터 한 번 기다리는 상한. 링크드인 1페이지(25명) 실측 1~2분 — 넘기면 액터 쪽 장애다

slack:
  # 명시 값만 억제로 인정한다. truthy 판정이면 KV_NO_SEND=0 도 "켜짐"이 된다.
  suppress_values: ["1", "true", "yes", "on"]
  # 승인 어휘. 아무나 눌러도 인정한다 [사용자 결정 2026-08-18] —
  # 정현님이 심사역 대신 누르는 경우가 있다.
  reaction_no: [x, heavy_multiplication_x, negative_squared_cross_mark, no_entry_sign]
  reaction_yes: [white_check_mark, o, heavy_check_mark, ok_hand, "+1"]
  reaction_ack: [raising_hand, man-raising-hand, woman-raising-hand, person_raising_hand, hand]   # 🙋 "내가 맡는다" — 메일·비플랜 공용
  # 메일 질문의 무반응 처리는 mail_observe.remind_days / remind_max 다 — 무응답을 거절로 바꾸지 않는다 [2026-09-21].

gmail:
  # 숫자는 전부 옛 시스템(2025-07~2026-09, 지웠다)에서 사고를 겪고 정해진 값이다.
  token_refresh_lead_sec: 60   # access_token 은 1시간. 만료 후 갱신은 401 한 번을 낭비한다.
  mass_blast_recipients: 20    # To+Cc+Bcc 합. 이 이상이면 대량 발송으로 본다.
  named_partner_body_chars: 1500  # 심사역 지명은 본문 앞부분에만 있다. 뒤는 인용문이다.
  # 본문 상한은 mail_observe.body_chars 다(한 통씩 부르므로 배치 상한이 없다 — 옛 15통 배치는 140k 자로 timeout 이 났다).
  # 자동 발송 승격의 **유일한** 근거.
  # [2026-09-21] 재는 대상이 바뀌었다 — 새 흐름에는 사람이 초안을 누르는 단계가 없다. 그래서 "사람이 안 고치고 보낸 비율" 대신
  #   "사람이 단 정답(observe --op label)과 분류가 일치한 비율"을 잰다(observe.report 의 승격 줄). **원칙은 같다**:
  #   기간(window_days) 안의 표본이 min_samples 이상이고 비율이 rate 이상일 때만 그 갈래를 켜도 된다고 말한다.
  promote:
    rate: 0.95
    window_days: 21
    min_samples: 5             # 🔴 옛 시스템은 이 값이 문서에만 있고 코드에 없었다.
                               #    표본 1건이 100% 면 승격을 통과해버린다.
  # 분류와 무관하게 **영원히** 사람이 보낸다. 무수정률이 100% 여도 승격 대상이 아니다.
  #    카테고리 이름이어야 걸린다(flow._reply 가 판정 카테고리와 비교). 옛 PARTNERSHIP_DECLINE 은 어디에도 안 걸렸다 [2026-10-15 고침]
  never_auto_send: [PARTNERSHIP, TRUSTED_REF, RECRUIT, IMPERSONATION, FORM_ERROR]   # FORM_ERROR: "검토하겠다" 약속 — 사람이 보낸다 [2026-10-15]

bplan:
  # 🔴 밖으로 나가는 문(kvlib.gate). off 기록만 · slack 카드·리마인드만 · on 노션 점수·to do·드랍 초안까지. 켜는 건 사람.
  outbound: "off"
  # 드랍 초안을 **실제 발송**하는 점수 갈래. 허용 목록 — 비어 있으면 초안까지. 승격 기준(gmail.promote) 통과 뒤 ["칼드랍"] 부터
  send_branches: []
  card_channel: "test"         # 볼만(Orange·Green) 카드와 ?(애매). 심사역 안내 뒤 "bplan"(#Squad-비플랜)
  report_channel: "test"
  report_slack: "on"
  deck_chars: 15000            # 덱 텍스트 상한 — 앞 2/3 · 뒤 1/3. 폼 텍스트는 그대로(칸당 최대 2,000자)
  remind_days: 3
  remind_max: 3
  backup_keep: 7
  drop_after_days: 7           # 같은 이메일에게 드랍 초안은 1주일에 하나 [옛 결정 — 영구로 막으면 3개월 뒤 재접수에 답이 안 간다]

bplan_label:
  # 블라인드 라벨링(skills/bplan/blind.py) [사용자 결정 2026-10-14 — 정답이 모자라 매일 review_test 로 받는다]
  # 🔴 비플랜 본 문(bplan.outbound)과 따로다. 카드는 review_test 에만 간다(blind.CH 고정). 노션·메일엔 안 쓴다
  outbound: "slack"            # off 기록만 · slack 카드·폼 답글만 실제로
  since: "2026-01-01T00:00:00" # 이 접수시각(KST) 이후만 — 지금 접수와 성격이 비슷하고 덱이 다 읽힌다
  per_day: 35                  # [사용자 지정] 하루 몇 장
  salt: "2026-10-14"           # 무작위 순서의 씨앗. 바꾸면 순서가 통째로 바뀐다 — 바꾸지 않는다
  reason_days: 3               # 라벨 뒤 이 기간까지 스레드 이유를 다시 읽는다(늦게 다는 경우)
  reaction_yes: [o, white_check_mark, heavy_check_mark, "+1"]          # ⭕ 볼만
  reaction_no: [x, heavy_multiplication_x, negative_squared_cross_mark] # ❌ 아님
  reaction_maybe: [thinking_face, question, grey_question]              # 🤔 애매

drive:
  # 덱 읽기(kv_transport/drive.py). 시트와 같은 서비스계정, 스코프만 drive.readonly.
  timeout_sec: 60              # 덱은 수 MB — 시트보다 넉넉히
  max_bytes: 40000000          # 이보다 크면 안 받는다(40MB). 이미지 덩어리라 글자도 없다
  min_text_chars: 200          # 이 미만이면 이미지 덱으로 본다 — 모델이 옮겨 적고, 그것도 이 미만이면 "덱을 못 읽었다"를 사실로 넘긴다
  transcribe_timeout_sec: 600  # 이미지 덱 옮겨 적기(skills/bplan/judge.transcribe). 실측 3쪽 11초 → 25쪽 덱이 claude.timeout_sec(300)에 걸릴 수 있다

sheets:
  # 서비스계정 JWT 는 구글이 **최대 1시간**만 받는다. 더 길게 주면 invalid_grant.
  jwt_lifetime_sec: 3600
  token_refresh_lead_sec: 60   # access_token 도 1시간. 만료 후 갱신은 401 한 번을 낭비한다
  # 값은 **표시 문자열**로 받는다. 옛 시스템(gspread get_all_values)이 그렇게 받았고,
  # 노션 `접수키` 가 그 문자열(한국어 로케일 타임스탬프)에서 만들어졌다.
  # UNFORMATTED 로 바꾸면 일련번호(float)가 와서 기존 키와 어긋난다 — 같은 접수가 두 번 들어간다.
  value_render: FORMATTED_VALUE

linkedin:
  # 🔴 밖으로 나가는 문(kvlib.gate). 살아 있는 시스템이라 **on 에서 시작**한다 — off/slack 은 시험·중단용.
  #    off: 구매·착지·카드·초안·승격을 안 하고 actions 에 dry 로만 적는다 · slack: 카드·초안(슬랙 글)만 실제로 · on: 전부
  outbound: "on"
  # 🔴 극초기 승격 — 노션 자동화(`DB로 업데이트` 체크박스)와 **둘 다 켜져 있으면 이중 생성**이다.
  #    08-18 실제로 중복 10행이 생겨 5행을 아카이브했다. 08-19 21:5x 실측으로 자동화가 꺼진 걸 확인하고 열었다
  #    (첫 시도에선 Pick 만 꺼지고 극초기가 1,304 로 늘어 되돌렸다 — 자동화가 두 갈래였다).
  promote: true
  card_channel: "net"         # #그물망 [사용자 결정 2026-08-19] 1티어를 하루 5명씩 심사역 채널로. 실패·요약은 report_channel
  report_channel: "test"      # 실패 알림·하루 요약·health 는 review_test 로 — 심사역 채널에 우리 실패 로그가 쌓이면 카드를 안 보게 된다
  report_slack: "on"
  # [사용자 결정 2026-08-19] 1티어는 전수 훑기가 목적이라 Wait·Cut 도 보낸다. 정렬은 Catch → Trend → Wait → Cut.
  card_tiers: [Catch, Trend, Wait, Cut]
  # 카드에 회사 개괄 3줄 [사용자 피드백 2026-10-15 "회사 법인명 웹/링크드인에 검색해서 개괄 간단히"].
  #    올릴 사람만(하루 5명) claude 웹 조사 — 사람당 1~1.5분, 동시에. 실패하면 그 사람만 개괄 없이 나간다.
  card_overview: true
  # 재고 기준선(backlog_cap: 100)은 2026-09-29 에 없앴다 [사용자 결정] — 재고가 많다고 안 사면 카드가 늙은 재고만 돈다.
  #    지출 상한은 축의 주기·페이지 수(skills/linkedin/axes.py)가 맡는다.
  # 연결 요청 메모 상한(connect_note_chars: 300)은 2026-09-29 에 없앴다 — 짧은 초안을 안 쓴다. 문안은 outreach.md 하나.
  # ✅ 연락 문안의 맞춤 문단 [사용자 결정 2026-10-16 — Reviewer A 심사역 문안으로 교체, 문장 틀 고정·내용만 바꿔 끼움].
  #    ✅ 한 명에 claude 1번(웹 없음, 프로필 + 카드 때 웹 개괄). 꺼도 문안은 나간다 — 첫 문장("링크드인에서 … 연락드립니다")만.
  outreach_pitch: true
  outreach_batch: 10          # 카드 문장(brief) claude 한 번에 넣는 인원
  # 🔴 ✅ 를 못 받은 사람의 만기. 없으면 대기줄이 영원히 자란다 —
  #    실측 2026-08-31: 31명이 쌓여 followup 로그가 83KB 가 됐고, 매 10분
  #    "✅ 없음 (대기 31명)" 만 찍었다. 반응 지연 실측(11명)은 중앙값 당일 ·
  #    10명이 3일 안이라 7일이면 사실상 답이 나온 것이다. 메일과 같은 값으로 맞춘다.
  followup_days: 7
  # 🔴 남은 재고가 이 일수 이하면 미리 알린다. 로그는 "남으면 3일 더"라고 세고
  #    있었는데 그 숫자가 사람에게 간 적이 없어, 0 이 된 걸 닷새 뒤에 알았다.
  stock_warn_days: 3
  # 🔴 ✅ 뒤 연락 리마인드 [사용자 결정 2026-09-29 회의]. 심사역 개인 계정으로 나가는 연락이라 우리는 보냈는지 모른다 —
  #    그래서 누른 분을 한 번 핑한다. 누른 날 + N일, 그날이 주말·공휴일(calendar.holidays_kr)이면 다음 평일.
  remind_after_days: 2
  remind_channel: "net"        # 스레드 답글이 아니라 채널 본문 [사용자 결정 2026-09-29]
  remind_since: "2026-09-29"   # 이날 이후 ✅ 만. 그 전 ✅ 는 소급하지 않는다(리마인드가 생기기 전의 결정)
  # 🔴 늦은 반응 [사용자 결정 2026-10-14] — 심사역이 바빠 7일 뒤에 누르기도 한다(10/2~13 카드 40장 반응 0).
  #    결론 난 카드도 최근 N주는 followup 이 하루 한 번 다시 읽는다: 늦은 ✅ 는 문안·승격·리마인드까지, 늦은 ❌ 는 정답만.
  #    learn 의 표본 창도 같은 값이다.
  learn_weeks: 4
  # learn 의 특징 표 — 구간 표본이 이 미만이면 '표본 부족'으로만 적는다(비율을 말하지 않는다). 주 10~20건 정답으로는 작은 구간이 우연에 흔들린다
  learn_min_n: 15
  # 🔴 재확인(recheck) [사용자 결정 2026-10-14 "전체 30일"] — 감시 목록(국적·나이·✅·손댄 행 빼고 그때 안 맞았던 사람 전부)을
  #    사람마다 30일에 한 번 profile-scraper 로 다시 긁는다($4/1천 명). 10/14 기준 ~1,574명 → 월 ≈ $6.3 (apify.monthly_cap_usd 29 안).
  #    recheck_max = 한 번에 사는 상한. 첫 주는 전원이 기한이라 이걸로 4주에 나눈다(기준일 오래된 순).
  recheck_days: 30
  recheck_batch: 100
  recheck_max: 400

mail_observe:
  # 관찰 파이프라인(skills/mail/observe.py) — 메일함·슬랙에 **쓰지 않는다.** 읽고 분류하고 기록만 한다.
  # 현행 plan/apply 는 이 절을 안 읽는다.
  own_addresses: ["deals@example.vc", "deals@example.vc"]   # 우리가 보낸 메일을 가리는 기준(별칭 포함)
  lookback_days: 7             # 매 실행마다 이만큼 다시 훑고 이미 본 건 건너뛴다(id 만 받으므로 싸다). 맥이 며칠 자도 빈틈이 없다
  list_max: 500                # 목록 상한. 닿으면 partial 로 끝난다(조용히 자르지 않는다)
  judge_attempts_max: 3        # 같은 메일을 이만큼 실패하면 그만 부른다(무한 재호출 방지)
  body_chars: 6000             # 새로 쓴 본문 상한. 한 통씩 부르므로 현행(2500)보다 넉넉하다
  quoted_chars: 1500           # 인용·전달된 글 상한
  backup_keep: 7
  # 🔴 밖으로 나가는 문(flow.py `_out`). 바꾸는 건 사람이다.
  #    off    아무것도 안 하고 무엇을 했을지만 적는다
  #    slack  슬랙 글만 올린다(질문·리마인드·인계). 초안·아카이브는 계속 기록만 — 시험은 여기서 한다
  #    on     메일함에도 쓴다(초안·아카이브). 게시 채널은 route.POST_CH(test), 메일은 초안까지다
  outbound: "off"
  # 자동 발송(flow.reply_all). 🔴 **허용 목록**이다 — 여기 적힌 카테고리만, 그것도 outbound 가 on 일 때만 나간다. 기본은 아무것도 없다.
  #    후보는 route.decide() 가 'reply' 를 돌려주는 갈래(지금 INBOUND_KO · PARTNERSHIP — PARTNERSHIP 는 never_auto_send 라 초안까지)다. 켜기 전에 현행 plan/apply 의 그 갈래를 끈다 —
  #    안 그러면 현행이 같은 메일에 초안을 또 만들고, 사람이 그걸 누르면 같은 안내가 두 번 간다.
  send_branches: []
  send_per_day: 20             # 하루 발송 상한. 폭주 방지다 — 평소 콜드 문의는 하루 서너 통
  intake_landed_days: 2        # 폼 오류 접수가 시트에 들어간 뒤 이만큼 지나도 비플랜 노션 행이 없으면 보고서 🚩 [2026-10-15]
  partnership_decline_days: 7  # 국내 제휴 제안은 이만큼 기다렸다가 거절 초안 [사용자 결정 2026-10-13]. 그사이 사람이 답하면 건너뛴다
  remind_days: 2               # 질문·인계 글에 이만큼 반응이 없으면 스레드에 한 줄. 무응답을 거절로 바꾸지 않는다
  remind_max: 3
  # 🔴 메일이 슬랙에 올리는 **모든** 글의 채널 — 섭외·신뢰 경로 질문(route 'slack')과 애매·채용·사칭 공유(flow._forward) [2026-10-15 한 값으로 합침].
  #    전엔 코드 상수(route.POST_CH)와 이 값 두 군데라 한쪽만 바꾸면 반쪽만 실채널로 갔다. 실채널("bplan" = #Squad-비플랜)로 바꾸는 건 슬랙 공유를 켜는 날 사람이 한다.
  slack_channel: "test"
  # 🔴 문(outbound)이 'on' 이 아니어도 실제로 하는 종류 — **허용 목록**이다. 기본은 비었다. 단계적으로 켤 때 하나씩 넣는다(첫 후보: archive).
  #    쓸 수 있는 종류: archive · draft · intake · fwd_mail · post · forward · handoff · ack · clarify · remind. 🔴 send 는 넣어도 무시된다 — 발송은 send_branches 뒤만.
  open_kinds: ["archive"]      # [사용자 결정 2026-10-20] 1단계 — 아카이브만, 그것도 아래 open_categories 의 카테고리만
  # 🔴 open_kinds 로 연 종류를 **카테고리로 다시 좁힌다** — 허용 목록. 여기 적힌 종류는 적힌 카테고리만 실제로 하고 나머지는 dry 다.
  #    적히지 않은 종류는 open_kinds 대로(전부). 1단계는 사람이 논의할 게 없는 메일만: 기계 알림 · 단체 발송(구독해지·대량 수신) · 끝난 건의 감사 답장.
  #    2단계 후보(FOREIGN_COLD · VENDOR_PITCH · LP_CUSTODY)는 모델이 내용으로 가르는 갈래라 1~2주 사람 브리핑과 맞춰 본 뒤에 넣는다.
  #    아카이브는 되돌릴 수 있지만 잘못 빠지면 아무도 못 본다 — 그래서 하루 보고서·슬랙 요약에 「자동 아카이브」 목록이 붙는다(observe.report).
  open_categories:
    archive: ["SYSTEM_NOTICE", "AD_NOISE", "MASS_BLAST", "CLOSED_FOLLOWUP"]
  report_after_hour: 10        # 하루 보고서는 KST 이 시각 뒤 첫 실행에서 한 번 [2026-10-20 — 관찰이 매시간 돌게 되어 자정 직후 실행이 빈 보고서를 내지 않게]
  sender_name: "에반"          # 심사역 포워드 인사말의 이름("투자팀 인턴 ○○입니다"). 🔴 인수인계 때 바꾼다
  # 하루 보고 요약을 슬랙에 올린다 [사용자 결정 2026-09-21]. 위의 outbound 와 별개다 — 보고서만 먼저 열었다.
  report_slack: "on"
  report_channel: "test"       # review_test. 전체 표는 ~/kv-data/mail/reports/<날짜>.md

# ---------------------------------------------------------------- 분류 라벨 (skills/mail/labels.py, 2026-09-29)
mail_labels:
  # 🔴 판정을 메일함에 kv/<카테고리> 라벨로 보이게 한다 [사용자 결정 2026-09-29]. 나가는 글이 아니라 정리라 되돌릴 수 있다 —
  #    그래서 발송 문(mail_observe.outbound)과 따로 연다. off = 무엇을 붙였을지만 기록 · on = 붙인다(라벨이 없으면 만든다). 켜는 건 사람이다.
  outbound: "off"
  prefix: "kv/"                # 라벨 이름 앞머리. 사람이 이 앞머리 라벨을 다른 것으로 옮기면 정답이 된다
  sync_days: 14                # 붙인 지 이만큼 안인 메일만 되읽는다(통당 GET 하나). 그 뒤의 이동은 --op label 로

# ---------------------------------------------------------------- 투심보고서 요청 레인 (skills/memo, 2026-09-26)
memo:
  # 🔴 밖으로 나가는 문. 나가는 것은 슬랙 스레드의 글(ack·note)과 파일(deliver)뿐 — 노션에 쓰지 않는다.
  #    off 는 기록만 · slack 은 스레드에 올린다. on 은 없다(그 이상 나가는 것이 없다). 켜는 건 사람이다.
  outbound: "off"
  request_channel: "test"      # 요청을 읽고 답하는 채널. 실채널 전환은 사용자 결정 — 그때 slack.register 한 줄
  request_pattern: "투심"       # 최상위 메시지에 이 글자가 있으면 요청이다
  extra_requesters: []         # people.yaml 의 slack_id 에 더해 요청을 받아 줄 슬랙 멤버 ID. 명단 밖은 조용히 무시(기본 거부)
  collect_wait_min: 20         # 접수 답글 뒤 이만큼 기다렸다가 스레드의 파일을 모아 초안을 만든다. Example Company D 실측: 자료는 며칠에 걸쳐 왔다 — 기다리지 않고 '있는 것으로' 낸다
  session_timeout_min: 30      # 0단계 실측 9분. 23분은 망 사고였다
  max_versions: 5              # 피드백 라운드 상한. Example Company D 는 v27 까지 갔지만 그건 사람 편집 포함 — 레인은 5 에서 멈추고 사람에게 넘긴다
  report_channel: "test"
  report_slack: "on"
  backup_keep: 7
  # 세션에 허용하는 도구 — 허용 목록이다. 편집·삭제·git 은 run_skill 이 상시 금지한다
  allowed_tools: ["mcp__investment-memo", "Read", "WebSearch", "WebFetch", "Bash(cd *)", "Bash(*python*)"]

# ---------------------------------------------------------------- 펀드제안서 요청 레인 (skills/fund, 2026-09-26)
fund:
  # 🔴 밖으로 나가는 문. 나가는 것은 슬랙 스레드의 글(ack·note)과 파일(deliver)뿐 — 노션에 쓰지 않는다. 모델 호출도 없다(글자는 노션 원문 그대로).
  outbound: "off"
  request_channel: "test"
  request_pattern: "제안서"       # 최상위 메시지에 이 글자 + 노션 DB 링크 + 서식 hwp 첨부가 요청이다
  extra_requesters: []
  max_versions: 10               # 노션이 바뀔 때마다 다시 빌드한다. 공고 하나가 1~2주라 10 은 넉넉하고, 그 위는 사람이 본다
  report_channel: "test"
  report_slack: "on"
  backup_keep: 7
  # 서식 프로필 기본값 — 서식 파일에서 못 읽는 것. 9/9~9/10 LP 성장펀드 실전에서 사람이 화면을 보며 승인한 값이다.
  # 요청마다 profile.json 으로 복사되어 사람이 손질하고, ✅ 시점 제출본 실측이 다음 기본값 재료가 된다(하루 보고서).
  font: "한양신명조"              # 서식에서 글꼴을 못 읽었을 때만
  font_note: "한양중고딕"          # 표 아래 주석(*·주1) 글꼴 — 서식 파일 fontsUsed 실측(9/9)
  sizes: {SEC: 16, ITEM: 15, H1: 13, H2: 12, H3: 11, H4: 11, TXT: 11, TBL: 10, TT: 11, UNIT: 11, NOTE: 9}   # 가. / 1) / 가) / (1) / 본문 / 표 / [표 제목] / (단위) / 주석
  bullets:                       # 깊이별 글머리 글자·간격·왼여백·내어쓰기(HWPUNIT). 9/10 "이정도면 괜찮은듯" 시점 값
    - {glyph: "○", glyph_font: "한양견고딕", glyph_pt: 5, gap: "  ", margin_left: 3100, indent: -3100}
    - {glyph: "-", gap: " ", margin_left: 5100, indent: -2000}
  image_width_mm: 170            # 본문 폭(A4 210 − 좌우 20). 세로가 아래 상한을 넘으면 가로를 줄인다
  image_max_height_mm: 120
  preview_pages: 2               # 스레드에 같이 올리는 쪽 그림 수(rhwp 미리보기 PNG). 전체는 요청 폴더 vN/render/

# ---------------------------------------------------------------- 한글 통로 (kv_transport/hwp, 2026-09-26 — 펀드제안서 레인)
hwp:
  timeout_sec: 180             # 스크립트 하나(rhwp 전체 직렬화 포함)의 상한. 9/9 실측: 80쪽 본문 빌드가 30초 안이었다

calendar:
  # 🔴 한국 공휴일(대체공휴일 포함). "다음 평일"을 세는 스킬이 본다. 목록이 끝나기 30일 전부터 쓰는 쪽이 경고한다 —
  #    끝난 목록은 조용히 "공휴일 없음"이 된다. 2027 년은 음력 환산이라 정부 공고(보통 전년 6월)로 한 번 확인할 것.
  holidays_kr: [
    "2026-10-05", "2026-10-09", "2026-12-25",                                  # 개천절 대체 · 한글날 · 성탄절
    "2027-01-01", "2027-02-08", "2027-02-09", "2027-03-01", "2027-05-05",      # 설 연휴(2/6~8, 2/9 대체) · 삼일절 · 어린이날
    "2027-05-13", "2027-08-16", "2027-09-14", "2027-09-15", "2027-09-16",      # 부처님오신날 · 광복절 대체 · 추석
    "2027-10-04", "2027-10-11", "2027-12-27",                                  # 개천절 대체 · 한글날 대체 · 성탄절 대체
  ]

# ---------------------------------------------------------------- 살림 (skills/ops, 2026-09-26 — 옛 kv-automation 스케줄러의 backup·retention 이관)
ops:
  backup_dir: "~/kv-data-backup"
  backup_keep: 7               # 스냅샷 보관 일수. 하드링크라 실제 디스크는 변한 파일만큼만 는다
  backup_min_files: 100        # 원본 파일이 이보다 적으면 중단 — 마운트 실패·경로 오타로 빈 백업이 멀쩡한 스냅샷을 밀어낸 사고를 막는다
  backup_stale_days: 2         # 이틀 넘게 스냅샷이 없으면 health 가 말한다. 하루는 맥이 잠들 수 있다
  report_channel: "test"
  report_slack: "on"
  # 하루 요약 슬랙을 ops digest 한 통으로 묶는다(report.daily). off 면 스킬마다 예전처럼 따로 보낸다. 실패 경보(report.post)는 이 키와 무관하게 각자 낸다
  digest_slack: "on"
  # 🔴 보존 규칙 = 허용 목록. 여기 없는 glob 은 지울 수 없다. 오늘 백업이 성공했을 때만 집행한다.
  #    영구(규칙에 넣지 않는다): linkedin/raw(유료 Apify 원본) · _archive/(옛 시스템 데이터) · */db/backup(스킬 sqlite 사본은 store.backup 이 스스로 7일 보관) · reports
  retention:
    - { name: claude-usage, glob: "_usage/claude/*.jsonl", keep_days: 90, min_keep: 30 }   # 호출 수 프록시. 석 달이면 폭주 패턴을 보기에 충분
    - { name: memo-request-inputs, glob: "memo/requests/*/in/*", keep_days: 180, min_keep: 0 }   # 심사역이 스레드에 올린 자료 사본. 반년 뒤엔 슬랙이 원본
