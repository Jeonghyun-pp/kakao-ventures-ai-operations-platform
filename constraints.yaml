# [0] 외부 제약 — 기계가 읽는 판
#
# 남의 시스템이 그렇게 생겨서 우리가 어쩔 수 없이 지키는 숫자들이다.
# **코드에 이 값을 리터럴로 박지 않는다.** 여기서 읽는다.
# 그래야 제약이 흩어지지 않고, 바뀔 때 한 줄만 고친다.
#
# 근거는 ~/kv-automation/docs/contracts/30-external-constraints.md (56항목, 네트워크 0으로 실측)

appstore:
  # 차트 천장. "200 요청했는데 100 왔다"를 결손으로 오판하지 않기 위해 안다.
  chart_caps:
    top-free: 200        # SSR
    top-paid: 200        # SSR
    top-grossing: 100    # RSS
    new: 110             # RSS. 하드캡이고 genre 를 무시한다

  # RSS newapplications 는 genre 파라미터를 무시한다 → 전체 1회만 부른다.
  # 어기면 25개 장르 × 같은 응답을 25번 받는다.
  rss_new_ignores_genre: true

  # 빈 배열이 정답인 차트. 카지노 유료는 한국 앱스토어에 원래 없다.
  # 어기면 "부분 결손" 경보가 매일 뜬다 (실제로 그랬다).
  empty_is_valid:
    - "7006/top-paid"

  # 신규진입은 diff 라 안 본 날은 영영 못 본다. 관측 40일 중 8일이 결손이었고 복구 불가.
  observation_gap_is_permanent: true

  # 출시일 미상 비율이 이걸 넘으면 lookup 장애를 의심한다. 평시 0% (실측 4,971/4,971).
  unknown_release_date_warn_ratio: 0.05

  # 🔴 [2026-08-17 실측 · 새 제약] 애플 SSR 차트 페이지는 연속 요청에 429 를 준다.
  #    간격 없이 76요청을 쏘면 39/76 이 429 로 죽었다. 개별로 다시 부르면 전부 200.
  #    옛 시스템은 "429 는 상대의 답이니 재시도 안 한다"로 404 와 같이 취급했는데,
  #    429 는 **"천천히 하라"는 재시도 신호**라 404 와 성격이 다르다.
  #    → 요청 사이에 간격을 두고, 429 는 Retry-After 를 존중해 재시도한다.
  request_gap_sec: 1.0

  # 판정 기준일은 **로컬(KST)** 이다. 스케줄러 period 는 UTC 라 00~09시 KST 에 하루 어긋난다.
  # 07:00 KST = 22:00 UTC(전날). UTC 로 날짜를 세면 사람이 보는 날짜와 어긋나 매일 아침 오탐이 난다.
  # (08-17 실측: 보고가 "오늘 2,808건 착지"라고 했는데 실제는 77건이었다)
  day_boundary: local_kst

  # 신규 판정 기준. 이보다 오래된 앱은 버린다.
  max_age_days: 180

  # 국적 판정(kr_origin). 규칙을 고치면 반드시 eval 을 돌린다.
  kr_origin:
    hangul_foreign_max_ratio: 0.05   # L7: 한글 비율 이하면 foreign
    min_description_length: 40        # L7: 이보다 짧으면 비율 판정 안 함
    over_deletion_warn_ratio: 0.90    # HEALTH: 외국 비율 이 이상이면 경고

http:
  # 망 계열만 재시도한다. 404·429·5xx 는 상대 서버의 답이지 망 문제가 아니다.
  # RequestException 을 통째로 잡으면 MissingSchema 같은 프로그래밍 오류까지 105초 기다렸다
  # 재시도한다 — 고쳐야 할 것을 숨긴다.
  retry_backoff_sec: [15, 30, 60]     # 총 105초. 절전 해제 직후 DNS 미기동 대비 (07-18 착지 229건 유실)
  timeout_sec: 30
  # 429·5xx 는 망 계열과 **다른 정책**이다. 429 는 "천천히 하라"는 재시도 신호이고
  # (Retry-After 를 주면 그걸 따른다), 5xx 는 상대의 일시 장애다.
  # 404·400 같은 4xx 는 여전히 재시도하지 않는다 — 그건 상대의 확정된 답이다.
  retry_status: [429, 500, 502, 503, 504]
  status_backoff_sec: [2, 5, 15]
  # 회로 차단기: 한 번 끝까지 실패하면 나머지는 즉시 실패시킨다.
  # 없을 때 76요청 × 105초 = 2시간+ 크론이 잠겼다 (07-19).
  circuit_breaker: true

notion:
  rich_text_limit: 2000        # UTF-16 코드유닛. 파이썬 len 이 아니다.
                               # 이모지 3개로 2000자가 2003유닛 되어 495명 중 7명 착지 실패 (07-27)
  rich_text_unit: utf16_code_units
  truncation_mark: "…⟪잘림⟫"    # 잘렸으면 잘렸다고 말한다. 값만으로는 구별이 안 된다.
  children_max: 100
  # 🔴 [2026-08-17 실측 · 새 제약] 노션은 유니코드 줄 구분자를 **조용히 제거한다.**
  #    앱 설명 864자를 보냈더니 862자가 저장됐다(U+2028 두 개가 사라짐).
  #    되읽기가 없었으면 영영 몰랐을 손실이다 — 옛 시스템엔 되읽기가 없었다.
  #    → 보내기 전에 개행으로 바꾼다. 그러면 저장된 값이 우리가 의도한 값과 같아진다.
  # 🔴 값 자체를 날것으로 쓰면 YAML 이 그 자리에서 줄바꿈으로 읽는다(실측 — 제약 파일이
  #    제약 문자 때문에 깨졌다). **이스케이프로 쓴다.**
  strips_chars: ["\u2028", "\u2029"]
  # 🔴 [2026-08-17 2차] U+0008(백스페이스)도 같은 일을 당했다 — 링크드인 about/headline 4건.
  #    하나씩 잡으면 계속 나온다. C0 제어문자를 **부류로** 막는다(\n·\t 는 남긴다).
  #    노션이 정확히 무엇을 지우는지는 문서에 없다. 되읽기가 새 문자를 만나면 또 잡을 것이고,
  #    그때마다 부류를 넓힌다.
  strips_control_chars: true
  # 🔴 [2026-09-16 실측 · 비플랜 첫 sync] 제로폭 문자도 지운다 — U+200B 하나 때문에 Example Company E 행이
  #    되읽기 불일치(610 vs 608)로 실패했다. 이건 개행이 아니라 **없애는** 게 맞다(폭이 0이다).
  strips_zero_width: ["\u200b", "\u200c", "\u200d", "\ufeff"]
  rate_limit_rps: 3            # 공식 한도. 성공해도 잔다.
  # 200 은 저장을 뜻하지 않는다 — 모르는 select 옵션을 조용히 버리면서 200 을 준다.
  write_verify: read_back
  # 옵션 목록의 정본은 항상 라이브 스키마다. 코드 상수를 믿으면 사람이 추가한 옵션을 되돌린다 (07-19).
  option_source: live_schema
  # 망 계열 예외 — ChunkedEncodingError 는 ConnectionError 의 서브클래스가 **아니다**.
  # 헤더는 왔는데 본문 도중 끊긴 경우로, 노션 query 응답에서 가장 흔하다 (08-13 재발).
  net_errors: [Timeout, ConnectionError, ChunkedEncodingError, ContentDecodingError]

claude:
  # 구독 세션에는 사용량 API 가 없다 → 호출 수를 프록시로 잰다.
  # 🔴 [사용자 결정 2026-09-21] 30/50 → 500/1000. 메일 관찰이 한 통에 한 번씩 부르고 상한 없이 돌리기로 했다.
  #    이 값은 쿼터 보호가 아니라 **폭주 감지**로만 남는다. 실제 구독 한도에 닿으면 claude 가 실패를 돌려주고
  #    호출부가 멈춘다(관찰은 그 실행을 중단하고 다음 날 잇는다).
  daily_calls_warn: 500
  daily_calls_block: 1000
  timeout_sec: 300             # 권한 프롬프트에 걸리면 무한정 멈춘다.
                               # 180 은 배치 하나를 못 끝내는 일이 잦았다 (08-30·31).
  # rc 0 + 빈 출력 = 인증 만료. rc 로 성공을 판정하면 인증 만료가 ok:true 로 기록된다.
  success_is_output_not_rc: true
  # 출력은 soft 다. 스키마를 줘도 강제가 아니다 → 되읽어 검증한다.
  wire: tsv                    # JSON 은 claude 가 " 를 이스케이프 안 해 배치 32건이 유실됐다.
  forbidden_tools: [Bash, WebFetch, WebSearch]

apify:
  monthly_cap_usd: 29          # STARTER 실한도. 플랫폼이 정하고 우리가 못 넘긴다.
  bill_on: request             # 런이 시작되면 과금. 응답을 못 받아도 돈은 나갔다.
  fallback_memory_mb: 8192     # 메모리 폴백 시 비싼 쪽을 가정한다 (과소계상 방지).
  archive_raw: true            # 원본을 안 남기면 파싱 버그를 돈 다시 써서 고친다.

slack:
  # 명시 값만 억제로 인정한다. truthy 판정이면 KV_NO_SEND=0 도 "켜짐"이 된다.
  suppress_values: ["1", "true", "yes", "on"]
  # webhook 은 ts 를 안 준다 → 반응 조회 불가. 그래서 2026-08-18 에 bot API 로 옮겼다.
  webhook_returns_ts: false
  # 🔴 실패해도 HTTP 200 을 준다. 본문의 ok 로 판정해야 한다.
  failure_is_http_200: true
  # 봇에 부여된 스코프(실측 08-18): incoming-webhook · groups:history · channels:history · chat:write
  # reactions:read 가 없어 reactions.list 는 못 쓴다 → conversations.history 로 읽는다.
  reactions_via_history: true
  # 승인 어휘. 아무나 눌러도 인정한다 [사용자 결정 2026-08-18] —
  # 정현님이 심사역 대신 누르는 경우가 있다.
  reaction_no: [x, heavy_multiplication_x, negative_squared_cross_mark, no_entry_sign]
  reaction_yes: [white_check_mark, o, heavy_check_mark, ok_hand, "+1"]
  # 메일 질문의 무반응 처리는 mail_observe.remind_days / remind_max 다 — 무응답을 거절로 바꾸지 않는다 [2026-09-21].

gmail:
  # 숫자는 전부 옛 시스템(2025-07~2026-09, 지웠다)에서 사고를 겪고 정해진 값이다.
  token_refresh_lead_sec: 60   # access_token 은 1시간. 만료 후 갱신은 401 한 번을 낭비한다.
  mass_blast_recipients: 20    # To+Cc+Bcc 합. 이 이상이면 대량 발송으로 본다.
  named_partner_body_chars: 1500  # 심사역 지명은 본문 앞부분에만 있다. 뒤는 인용문이다.
  # 본문 상한은 mail_observe.body_chars 다(한 통씩 부르므로 배치 상한이 없다 — 옛 15통 배치는 140k 자로 timeout 이 났다).
  # 자동 발송 승격의 **유일한** 근거.
  # [2026-09-21] 재는 대상이 바뀌었다 — 새 흐름에는 사람이 초안을 누르는 단계가 없다. 그래서 "사람이 안 고치고 보낸 비율" 대신
  #   "사람이 단 정답(observe --op label)과 분류가 일치한 비율"을 잰다(observe.report 의 승격 줄). **원칙은 같다**:
  #   기간(window_days) 안의 표본이 min_samples 이상이고 비율이 rate 이상일 때만 그 갈래를 켜도 된다고 말한다.
  promote:
    rate: 0.95
    window_days: 21
    min_samples: 5             # 🔴 옛 시스템은 이 값이 문서에만 있고 코드에 없었다.
                               #    표본 1건이 100% 면 승격을 통과해버린다.
  # 분류와 무관하게 **영원히** 사람이 보낸다. 무수정률이 100% 여도 승격 대상이 아니다.
  never_auto_send: [PARTNERSHIP_DECLINE, TRUSTED_REF, RECRUIT, IMPERSONATION]

sheets:
  # 서비스계정 JWT 는 구글이 **최대 1시간**만 받는다. 더 길게 주면 invalid_grant.
  jwt_lifetime_sec: 3600
  token_refresh_lead_sec: 60   # access_token 도 1시간. 만료 후 갱신은 401 한 번을 낭비한다
  # 값은 **표시 문자열**로 받는다. 옛 시스템(gspread get_all_values)이 그렇게 받았고,
  # 노션 `접수키` 가 그 문자열(한국어 로케일 타임스탬프)에서 만들어졌다.
  # UNFORMATTED 로 바꾸면 일련번호(float)가 와서 기존 키와 어긋난다 — 같은 접수가 두 번 들어간다.
  value_render: FORMATTED_VALUE
  # values.get 은 뒤쪽 빈 칸을 **생략한 채** 준다 → 행 길이가 제각각이다. 인덱스로 읽으면 IndexError.
  ragged_rows: true

linkedin:
  # 🔴 밖으로 나가는 문(kvlib.gate). 살아 있는 시스템이라 **on 에서 시작**한다 — off/slack 은 시험·중단용.
  #    off: 구매·착지·카드·초안·승격을 안 하고 actions 에 dry 로만 적는다 · slack: 카드·초안(슬랙 글)만 실제로 · on: 전부
  outbound: "on"
  # 🔴 극초기 승격 — 노션 자동화(`DB로 업데이트` 체크박스)와 **둘 다 켜져 있으면 이중 생성**이다.
  #    08-18 실제로 중복 10행이 생겨 5행을 아카이브했다. 08-19 21:5x 실측으로 자동화가 꺼진 걸 확인하고 열었다
  #    (첫 시도에선 Pick 만 꺼지고 극초기가 1,304 로 늘어 되돌렸다 — 자동화가 두 갈래였다).
  promote: true
  card_channel: "net"         # #그물망 [사용자 결정 2026-08-19] 1티어를 하루 5명씩 심사역 채널로. 실패·요약은 report_channel
  report_channel: "test"      # 실패 알림·하루 요약·health 는 review_test 로 — 심사역 채널에 우리 실패 로그가 쌓이면 카드를 안 보게 된다
  report_slack: "on"
  # [사용자 결정 2026-08-19] 1티어는 전수 훑기가 목적이라 Wait·Cut 도 보낸다. 정렬은 Catch → Trend → Wait → Cut.
  card_tiers: [Catch, Trend, Wait, Cut]
  # 🔴 재고 규칙 — 아직 슬랙에 안 나간 사람이 이만큼 남아 있으면 더 사지 않는다. 첫 실행에 590명(117일치)이 쌓인 뒤 정했다.
  backlog_cap: 100
  # 🔴 링크드인 연결 요청에 붙이는 메모의 글자 상한. 플랫폼이 정하고 우리가 못 넘긴다.
  #    이미 연결된 사이면 일반 메시지라 상한이 사실상 없어, 두 벌을 다 만든다.
  connect_note_chars: 300
  outreach_batch: 10          # claude 한 번에 넣는 인원
  # 🔴 ✅ 를 못 받은 사람의 만기. 없으면 대기줄이 영원히 자란다 —
  #    실측 2026-08-31: 31명이 쌓여 followup 로그가 83KB 가 됐고, 매 10분
  #    "✅ 없음 (대기 31명)" 만 찍었다. 반응 지연 실측(11명)은 중앙값 당일 ·
  #    10명이 3일 안이라 7일이면 사실상 답이 나온 것이다. 메일과 같은 값으로 맞춘다.
  followup_days: 7
  # 🔴 남은 재고가 이 일수 이하면 미리 알린다. 로그는 "남으면 3일 더"라고 세고
  #    있었는데 그 숫자가 사람에게 간 적이 없어, 0 이 된 걸 닷새 뒤에 알았다.
  stock_warn_days: 3

mail_observe:
  # 관찰 파이프라인(skills/mail/observe.py) — 메일함·슬랙에 **쓰지 않는다.** 읽고 분류하고 기록만 한다.
  # 현행 plan/apply 는 이 절을 안 읽는다.
  own_addresses: ["deals@example.vc", "deals@example.vc"]   # 우리가 보낸 메일을 가리는 기준(별칭 포함)
  lookback_days: 7             # 매 실행마다 이만큼 다시 훑고 이미 본 건 건너뛴다(id 만 받으므로 싸다). 맥이 며칠 자도 빈틈이 없다
  list_max: 500                # 목록 상한. 닿으면 partial 로 끝난다(조용히 자르지 않는다)
  judge_attempts_max: 3        # 같은 메일을 이만큼 실패하면 그만 부른다(무한 재호출 방지)
  body_chars: 6000             # 새로 쓴 본문 상한. 한 통씩 부르므로 현행(2500)보다 넉넉하다
  quoted_chars: 1500           # 인용·전달된 글 상한
  backup_keep: 7
  # 🔴 밖으로 나가는 문(flow.py `_out`). 바꾸는 건 사람이다.
  #    off    아무것도 안 하고 무엇을 했을지만 적는다
  #    slack  슬랙 글만 올린다(질문·리마인드·인계). 초안·아카이브는 계속 기록만 — 시험은 여기서 한다
  #    on     메일함에도 쓴다(초안·아카이브). 게시 채널은 route.POST_CH(test), 메일은 초안까지다
  outbound: "off"
  # 자동 발송(flow.reply_all). 🔴 **허용 목록**이다 — 여기 적힌 카테고리만, 그것도 outbound 가 on 일 때만 나간다. 기본은 아무것도 없다.
  #    후보는 route.decide() 가 'reply' 를 돌려주는 갈래(지금 INBOUND_KO · INBOUND_EN)다. 켜기 전에 현행 plan/apply 의 그 갈래를 끈다 —
  #    안 그러면 현행이 같은 메일에 초안을 또 만들고, 사람이 그걸 누르면 같은 안내가 두 번 간다.
  send_branches: []
  send_per_day: 20             # 하루 발송 상한. 폭주 방지다 — 평소 콜드 문의는 하루 서너 통
  remind_days: 2               # 질문·인계 글에 이만큼 반응이 없으면 스레드에 한 줄. 무응답을 거절로 바꾸지 않는다
  remind_max: 3
  # 제휴·분류 애매(UNKNOWN) 메일을 올리는 채널(flow._forward). 옛 시스템은 #Squad-비플랜 의 이메일 주소로 가는 초안을 만들었다 —
  #    새 시스템은 채널에 바로 올린다. 실채널("bplan")로 바꾸는 건 전환일에 사람이 한다.
  forward_channel: "test"
  # 하루 보고 요약을 슬랙에 올린다 [사용자 결정 2026-09-21]. 위의 outbound 와 별개다 — 보고서만 먼저 열었다.
  report_slack: "on"
  report_channel: "test"       # review_test. 전체 표는 ~/kv-data/mail/reports/<날짜>.md
